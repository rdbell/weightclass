<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Reading Room</title>
  <style>
    :root {
      --ink: #33281f;
      --paper: #efe5d4;
      --brass: #b68a46;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #17110d;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #ui {
      position: fixed;
      left: 0;
      top: 0;
      padding: 18px 22px;
      pointer-events: none;
      color: var(--paper);
      font-family: Georgia, "Times New Roman", serif;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65);
      z-index: 2;
    }
    #ui h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    #ui p {
      margin: 6px 0 0;
      font-size: 11px;
      letter-spacing: 0.09em;
      opacity: 0.8;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    #views {
      position: fixed;
      right: 18px;
      bottom: 18px;
      display: flex;
      gap: 8px;
      z-index: 2;
    }
    #views button {
      border: 1px solid rgba(239, 229, 212, 0.4);
      background: rgba(24, 18, 13, 0.72);
      color: var(--paper);
      padding: 8px 13px;
      border-radius: 3px;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: background 0.2s, border-color 0.2s;
    }
    #views button:hover,
    #views button.active {
      background: rgba(182, 138, 70, 0.35);
      border-color: rgba(239, 229, 212, 0.8);
    }
    @media (max-width: 620px) {
      #ui { padding: 12px 15px; }
      #ui h1 { font-size: 16px; }
      #ui p { font-size: 9px; }
      #views { right: 10px; bottom: 10px; }
      #views button { padding: 7px 9px; font-size: 9px; }
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1>The Reading Room</h1>
    <p id="hint">Drag to look around &middot; scroll to zoom</p>
  </div>
  <div id="views">
    <button id="doorBtn">Door</button>
    <button id="topBtn">Top</button>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "../../../vendor/three/build/three.module.js",
        "three/addons/": "../../../vendor/three/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
