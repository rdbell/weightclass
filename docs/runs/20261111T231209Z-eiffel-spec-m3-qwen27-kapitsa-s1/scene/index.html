<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cel-shaded Eiffel Tower</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #tod { position: fixed; top: 16px; right: 16px; display: flex; gap: 8px; z-index: 10; }
  #tod button {
    font: 600 14px/1 system-ui, -apple-system, sans-serif;
    letter-spacing: 0.02em;
    padding: 10px 18px;
    border-radius: 999px;
    border: 2px solid rgba(255, 255, 255, 0.65);
    background: rgba(15, 20, 34, 0.55);
    color: #fff;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  #tod button:hover { background: rgba(45, 52, 74, 0.75); }
  #tod button.active { background: #ffd23f; border-color: #ffd23f; color: #33230e; }
  #label {
    position: fixed; left: 16px; bottom: 14px; z-index: 10;
    font: 400 12px/1.5 system-ui, -apple-system, sans-serif;
    color: rgba(255, 255, 255, 0.85);
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<div id="tod">
  <button data-tod="day">Day</button>
  <button data-tod="dusk">Dusk</button>
  <button data-tod="night">Night</button>
</div>
<div id="label">Cel-shaded Eiffel Tower: vertex light → band LUT → palette LUT · drag to orbit, scroll to zoom</div>

<script type="importmap">
{ "imports": {
    "three": "../../../vendor/three/build/three.module.js",
    "three/addons/": "../../../vendor/three/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------------------
// Seeded randomness so every load looks the same
// ---------------------------------------------------------------------------
function mulberry32(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(0xC0FFEE);
const randRange = (a, b) => a + (b - a) * rand();

// ---------------------------------------------------------------------------
// Renderer / scene / camera / controls
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
// The scene is static for a given time of day (only clouds drift, and they
// cast no shadows), so the 2048 shadow map only needs re-rendering when the
// sun/moon moves. applyTimeOfDay() flips needsUpdate.
renderer.shadowMap.autoUpdate = false;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.Fog(0x000000, 600, 1700);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 4000);
camera.position.set(330, 165, 430);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 115, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.minDistance = 80;
controls.maxDistance = 1400;
controls.maxPolarAngle = Math.PI * 0.495;
controls.update();

// ---------------------------------------------------------------------------
// Sun / moon: one directional light with a real shadow map
// ---------------------------------------------------------------------------
const light = new THREE.DirectionalLight(0xffffff, 1);
light.castShadow = true;
light.shadow.mapSize.set(2048, 2048);
light.shadow.camera.left = -280;
light.shadow.camera.right = 280;
light.shadow.camera.top = 280;
light.shadow.camera.bottom = -280;
light.shadow.camera.near = 1;
light.shadow.camera.far = 1500;
light.shadow.bias = -0.0004;
light.shadow.normalBias = 0.6;
light.shadow.radius = 3;
const lightTarget = new THREE.Object3D();
lightTarget.position.set(0, 100, 0);
scene.add(lightTarget);
light.target = lightTarget;
scene.add(light);

// ---------------------------------------------------------------------------
// Time of day
// ---------------------------------------------------------------------------
const TIMES = {
  day: {
    sky: 0x56bce8,
    sunDir: new THREE.Vector3(300, 420, 180).normalize(),
    shadowStrength: 0.5,
    outline: 0x2b1a10,
    palettes: {
      iron:     [0x7d4f2c, 0xa56a38, 0xc8864a, 0xe8a45e],
      ironDark: [0x6d4426, 0x946034, 0xb87a42, 0xd89450],
      ground:   [0x3f8a35, 0x5cb04a, 0x6fc258, 0x82d468],
      plaza:    [0xb09058, 0xd0b078, 0xe0c088, 0xf0d098],
      leaf:     [0x3a7a34, 0x4f9c44, 0x60b452, 0x74cc62],
      trunk:    [0x5a3e26, 0x7a5230, 0x8f6238, 0xa47440],
      cloud:    [0xc8d8e8, 0xe8f0f8, 0xf4f8fc, 0xffffff],
    },
  },
  dusk: {
    sky: 0xef9a58,
    sunDir: new THREE.Vector3(1.0, 0.16, 0.28).normalize(),
    shadowStrength: 0.42,
    outline: 0x2a1608,
    palettes: {
      iron:     [0x6a3a1e, 0x9c5828, 0xc87838, 0xf09848],
      ironDark: [0x5a3016, 0x8a4c24, 0xb86834, 0xd88840],
      ground:   [0x4a6a28, 0x6a8838, 0x88a848, 0xa8c058],
      plaza:    [0xa88850, 0xc8a868, 0xe0c080, 0xf8d898],
      leaf:     [0x3a6a28, 0x558838, 0x70a848, 0x90c058],
      trunk:    [0x5a3820, 0x7a5230, 0x986838, 0xb88048],
      cloud:    [0xd89878, 0xf0b890, 0xf8d0b0, 0xffe8d0],
    },
  },
  night: {
    sky: 0x16263e,
    sunDir: new THREE.Vector3(0.5, 0.72, 0.45).normalize(),
    shadowStrength: 0.55,
    outline: 0x0a0e18,
    palettes: {
      iron:     [0x26364e, 0x384a66, 0x4a5c7a, 0x68789a],
      ironDark: [0x1e2c42, 0x2e3e58, 0x3e4e68, 0x586880],
      ground:   [0x16301f, 0x24462e, 0x345c3e, 0x4a7852],
      plaza:    [0x3a3e52, 0x4c5066, 0x5e6278, 0x787c92],
      leaf:     [0x16382a, 0x245038, 0x346848, 0x4a8858],
      trunk:    [0x222838, 0x323848, 0x424858, 0x585e70],
      cloud:    [0x303c54, 0x404c66, 0x505c78, 0x687490],
    },
  },
};

// ---------------------------------------------------------------------------
// Lookup textures
// ---------------------------------------------------------------------------
// 256x1 band LUT: four hard plateaus at the centers of the four palette
// texels. t < 0.5 -> shadow, t < 0.625 -> mid, t < 0.85 -> upper, else lit.
function makeBandLUT() {
  const size = 256;
  const data = new Uint8Array(size * 4);
  for (let i = 0; i < size; i++) {
    const t = (i + 0.5) / size;
    const v = t < 0.5 ? 0.125 : t < 0.625 ? 0.375 : t < 0.85 ? 0.625 : 0.875;
    const b = Math.round(v * 255);
    data[i * 4] = b;
    data[i * 4 + 1] = b;
    data[i * 4 + 2] = b;
    data[i * 4 + 3] = 255;
  }
  const tex = new THREE.DataTexture(data, size, 1);
  tex.minFilter = THREE.NearestFilter;
  tex.magFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}
const bandLUT = makeBandLUT();

// 4x1 palette LUT: [shadow, mid, upper, lit]. Values are stored linear
// (the hex colors are sRGB; convert through ColorManagement) so the shader
// works in linear space and linearToOutputTexel() recovers the intended hex.
function makePalette(hexes) {
  const data = new Uint8Array(4 * 4);
  const c = new THREE.Color();
  for (let i = 0; i < 4; i++) {
    c.set(hexes[i]);
    data[i * 4] = Math.round(c.r * 255);
    data[i * 4 + 1] = Math.round(c.g * 255);
    data[i * 4 + 2] = Math.round(c.b * 255);
    data[i * 4 + 3] = 255;
  }
  const tex = new THREE.DataTexture(data, 4, 1);
  tex.minFilter = THREE.NearestFilter;
  tex.magFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}

// Pre-build all 7 materials x 3 modes so switching is a uniform swap.
const MATERIAL_NAMES = ['iron', 'ironDark', 'ground', 'plaza', 'leaf', 'trunk', 'cloud'];
const paletteTextures = {};
for (const name of MATERIAL_NAMES) {
  paletteTextures[name] = {};
  for (const tod of Object.keys(TIMES)) {
    paletteTextures[name][tod] = makePalette(TIMES[tod].palettes[name]);
  }
}

// ---------------------------------------------------------------------------
// Shaders
// ---------------------------------------------------------------------------
// Vertex: per-vertex diffuse -> passed to the band LUT in the fragment stage.
const TOON_VERT = /* glsl */ `
#include <common>
#include <packing>
#include <fog_pars_vertex>
#include <shadowmap_pars_vertex>

uniform vec3 uLightDir;
varying float vDiffuse;

void main() {
  #include <begin_vertex>
  #include <beginnormal_vertex>
  #include <defaultnormal_vertex>

  vec4 mvPosition = modelViewMatrix * vec4( transformed, 1.0 );
  #include <worldpos_vertex>
  #include <shadowmap_vertex>

  vec3 n = normalize( mat3( modelMatrix ) * normal );
  vDiffuse = dot( n, uLightDir );

  gl_Position = projectionMatrix * mvPosition;
  #include <fog_vertex>
}
`;

const TOON_FRAG = /* glsl */ `
#include <common>
#include <packing>
#include <fog_pars_fragment>
#include <shadowmap_pars_fragment>

uniform sampler2D uBands;
uniform sampler2D uPalette;
uniform float uShadowStrength;
uniform float uReceiveShadow;
varying float vDiffuse;

void main() {
  // stage 1: diffuse -> 256x1 band LUT (four hard plateaus)
  float t = clamp( vDiffuse * 0.5 + 0.5, 0.0, 1.0 );
  float band = texture2D( uBands, vec2( t, 0.5 ) ).r;

  // stage 2: plateau -> per-material 4x1 palette LUT
  vec3 col = texture2D( uPalette, vec2( band, 0.5 ) ).rgb;

  // stage 3: real shadow map as a color multiplier AFTER the palette lookup
  float shadowFactor = 1.0;
  #ifdef USE_SHADOWMAP
  #if NUM_DIR_LIGHT_SHADOWS > 0
    DirectionalLightShadow dl = directionalLightShadows[ 0 ];
    float shadow = getShadow( directionalShadowMap[ 0 ], dl.shadowMapSize, dl.shadowIntensity,
                              dl.shadowBias, dl.shadowRadius, vDirectionalShadowCoord[ 0 ] );
    float shadowAmount = ( 1.0 - smoothstep( 0.4, 0.6, shadow ) ) * uReceiveShadow;
    shadowFactor = mix( 1.0, uShadowStrength, shadowAmount );
  #endif
  #endif

  gl_FragColor = vec4( col * shadowFactor, 1.0 );
  gl_FragColor = linearToOutputTexel( gl_FragColor );
  #include <fog_fragment>
}
`;

// Inverted-hull outline: constant pixel width, darkens in shadow, fogs.
const OUTLINE_VERT = /* glsl */ `
#include <common>
#include <packing>
#include <fog_pars_vertex>
#include <shadowmap_pars_vertex>

uniform float uPx;
uniform float uFov;
uniform float uViewportH;

void main() {
  #include <begin_vertex>
  #include <beginnormal_vertex>
  #include <defaultnormal_vertex>

  vec4 mvPosition = modelViewMatrix * vec4( transformed, 1.0 );
  #include <worldpos_vertex>
  #include <shadowmap_vertex>

  float worldW = uPx * 2.0 * -mvPosition.z * tan( uFov * 0.5 ) / uViewportH;
  mvPosition.xyz += normalize( normalMatrix * normal ) * worldW;
  gl_Position = projectionMatrix * mvPosition;
  #include <fog_vertex>
}
`;

const OUTLINE_FRAG = /* glsl */ `
#include <common>
#include <packing>
#include <fog_pars_fragment>
#include <shadowmap_pars_fragment>

uniform vec3 uColor;
uniform float uShadowStrength;
uniform float uReceiveShadow;

void main() {
  float shadowFactor = 1.0;
  #ifdef USE_SHADOWMAP
  #if NUM_DIR_LIGHT_SHADOWS > 0
    DirectionalLightShadow dl = directionalLightShadows[ 0 ];
    float shadow = getShadow( directionalShadowMap[ 0 ], dl.shadowMapSize, dl.shadowIntensity,
                              dl.shadowBias, dl.shadowRadius, vDirectionalShadowCoord[ 0 ] );
    float shadowAmount = ( 1.0 - smoothstep( 0.4, 0.6, shadow ) ) * uReceiveShadow;
    shadowFactor = mix( 1.0, uShadowStrength, shadowAmount );
  #endif
  #endif

  gl_FragColor = vec4( uColor * shadowFactor, 1.0 );
  gl_FragColor = linearToOutputTexel( gl_FragColor );
  #include <fog_fragment>
}
`;

// ---------------------------------------------------------------------------
// Materials
// ---------------------------------------------------------------------------
function makeToonMaterial(name, receiveShadow) {
  const uniforms = THREE.UniformsUtils.merge([
    THREE.UniformsLib.lights,
    THREE.UniformsLib.fog,
    {
      uBands: { value: bandLUT },
      uPalette: { value: paletteTextures[name].day },
      uLightDir: { value: new THREE.Vector3(0, 1, 0) },
      uShadowStrength: { value: 0.5 },
      uReceiveShadow: { value: receiveShadow },
    },
  ]);
  const mat = new THREE.ShaderMaterial({
    name,
    lights: true,
    fog: true,
    uniforms,
    vertexShader: TOON_VERT,
    fragmentShader: TOON_FRAG,
  });
  mat.userData.matName = name;
  return mat;
}

function makeOutlineMaterial(receiveShadow) {
  const uniforms = THREE.UniformsUtils.merge([
    THREE.UniformsLib.lights,
    THREE.UniformsLib.fog,
    {
      uColor: { value: new THREE.Color(0x2b1a10) },
      uShadowStrength: { value: 0.5 },
      uReceiveShadow: { value: receiveShadow },
      uPx: { value: 1.0 },
      uFov: { value: THREE.MathUtils.degToRad(camera.fov) },
      uViewportH: { value: window.innerHeight },
    },
  ]);
  return new THREE.ShaderMaterial({
    name: 'outline',
    lights: true,
    fog: true,
    uniforms,
    vertexShader: OUTLINE_VERT,
    fragmentShader: OUTLINE_FRAG,
    side: THREE.BackSide,
  });
}

const ironMat = makeToonMaterial('iron', 1);
const ironDarkMat = makeToonMaterial('ironDark', 1);
const groundMat = makeToonMaterial('ground', 1);
const plazaMat = makeToonMaterial('plaza', 1);
const leafMat = makeToonMaterial('leaf', 1);
const trunkMat = makeToonMaterial('trunk', 1);
const cloudMat = makeToonMaterial('cloud', 0);

const outlineMat = makeOutlineMaterial(1);
const cloudOutlineMat = makeOutlineMaterial(0);

const toonMats = [ironMat, ironDarkMat, groundMat, plazaMat, leafMat, trunkMat, cloudMat];
const outlineMats = [outlineMat, cloudOutlineMat];
const allMats = toonMats.concat(outlineMats);

// ---------------------------------------------------------------------------
// Mesh helper: real mesh + inverted-hull outline child (shared geometry)
// ---------------------------------------------------------------------------
function addMesh(geo, mat, opts = {}) {
  const {
    outline = true,
    cast = true,
    receive = true,
    outlineMat: hullMat = outlineMat,
  } = opts;
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = cast;
  mesh.receiveShadow = receive;
  if (outline) {
    const hull = new THREE.Mesh(geo, hullMat);
    hull.castShadow = false;
    hull.receiveShadow = true;
    mesh.add(hull);
  }
  return mesh;
}

// ---------------------------------------------------------------------------
// Tower (real dimensions, meters)
// ---------------------------------------------------------------------------
const tower = new THREE.Group();
scene.add(tower);

// Profile: power-curve interpolation between anchors (y, halfWidth)
const ANCHORS = [
  [0, 62.45],
  [57.63, 35.35],
  [115.73, 20.48],
  [276.13, 9.33],
  [300, 2.0],
];
const POWERS = [1.7, 1.4, 1.15, 1.2];
function halfWidth(y) {
  for (let i = 0; i < ANCHORS.length - 1; i++) {
    const [y0, w0] = ANCHORS[i];
    const [y1, w1] = ANCHORS[i + 1];
    if (y <= y1 || i === ANCHORS.length - 2) {
      const t = THREE.MathUtils.clamp((y - y0) / (y1 - y0), 0, 1);
      return w1 + (w0 - w1) * Math.pow(1 - t, POWERS[i]);
    }
  }
  return ANCHORS[ANCHORS.length - 1][1];
}

// Tapered cylinder between two points
const UP = new THREE.Vector3(0, 1, 0);
function strut(a, b, rBottom, rTop, radial, mat, open = false) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const geo = new THREE.CylinderGeometry(rTop, rBottom, len, radial, 1, open);
  const mesh = addMesh(geo, mat);
  mesh.position.copy(a).addScaledVector(dir, 0.5);
  mesh.quaternion.setFromUnitVectors(UP, dir.normalize());
  return mesh;
}

// Four curved corner legs: 32 profile samples per leg, open-ended 8-radial
// tapered struts (1.12x at the bottom -> 0.98x at the top hides joints).
const LEG_STEPS = 32;
for (const [sx, sz] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
  const pts = [];
  for (let i = 0; i <= LEG_STEPS; i++) {
    const y = (i / LEG_STEPS) * 300;
    const w = halfWidth(y);
    pts.push(new THREE.Vector3(sx * w, y, sz * w));
  }
  for (let i = 0; i < LEG_STEPS; i++) {
    const rBottom = Math.max(0.5, halfWidth(pts[i].y) * 0.08) * 1.12;
    const rTop = Math.max(0.5, halfWidth(pts[i + 1].y) * 0.08) * 0.98;
    tower.add(strut(pts[i], pts[i + 1], rBottom, rTop, 8, ironMat, true));
  }
}

// Lattice: per section, per level, per face: two X diagonals + top horizontal
const SECTIONS = [
  [0, 57.63, 6],
  [57.63, 115.73, 5],
  [115.73, 276.13, 8],
  [276.13, 300, 3],
];
const FACES = [
  [[1, 1], [1, -1]],   // +x face
  [[-1, 1], [-1, -1]], // -x face
  [[1, 1], [-1, 1]],   // +z face
  [[1, -1], [-1, -1]], // -z face
];
for (const [y0, y1, levels] of SECTIONS) {
  const bandH = (y1 - y0) / levels;
  for (let k = 0; k < levels; k++) {
    const yb = y0 + k * bandH;
    const yt = yb + bandH;
    const wb = halfWidth(yb);
    const wt = halfWidth(yt);
    const wm = halfWidth((yb + yt) / 2);
    const r = Math.max(0.3, wm * 0.028);
    for (const [c1, c2] of FACES) {
      const A = new THREE.Vector3(c1[0] * wb, yb, c1[1] * wb);
      const B = new THREE.Vector3(c2[0] * wb, yb, c2[1] * wb);
      const C = new THREE.Vector3(c1[0] * wt, yt, c1[1] * wt);
      const D = new THREE.Vector3(c2[0] * wt, yt, c2[1] * wt);
      tower.add(strut(A, D, r, r, 6, ironMat));
      tower.add(strut(B, C, r, r, 6, ironMat));
      tower.add(strut(C, D, r * 1.5, r * 1.5, 6, ironMat));
    }
  }
}

// Three platforms (dark iron boxes)
const PLATFORMS = [
  [57.63, 1.5, 6],
  [115.73, 1.5, 5],
  [276.13, 1.2, 4],
];
for (const [y, overhang, thickness] of PLATFORMS) {
  const hw = halfWidth(y) + overhang;
  const box = addMesh(new THREE.BoxGeometry(hw * 2, thickness, hw * 2), ironDarkMat);
  box.position.y = y;
  tower.add(box);
}

// Antenna
const antenna = addMesh(new THREE.CylinderGeometry(0.35, 1.1, 30, 6), ironDarkMat);
antenna.position.y = 315;
tower.add(antenna);
const antennaTip = addMesh(new THREE.SphereGeometry(1.1, 12, 8), ironDarkMat);
antennaTip.position.y = 330;
tower.add(antennaTip);

// ---------------------------------------------------------------------------
// Ground and plaza
// ---------------------------------------------------------------------------
const groundGeo = new THREE.CircleGeometry(1600, 48);
groundGeo.rotateX(-Math.PI / 2);
const ground = addMesh(groundGeo, groundMat, { cast: false, receive: true });
scene.add(ground);

const plazaGeo = new THREE.CircleGeometry(100, 48);
plazaGeo.rotateX(-Math.PI / 2);
const plaza = addMesh(plazaGeo, plazaMat, { cast: false, receive: true });
plaza.position.y = 0.15;
scene.add(plaza);

// ---------------------------------------------------------------------------
// Trees: 14 in a ring, radius 118-173
// ---------------------------------------------------------------------------
for (let i = 0; i < 14; i++) {
  const s = randRange(0.8, 1.5);
  const angle = (i / 14) * Math.PI * 2 + randRange(-0.15, 0.15);
  const radius = randRange(118, 173);
  const tree = new THREE.Group();
  tree.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
  tree.rotation.y = rand() * Math.PI * 2;
  tree.scale.setScalar(s);

  const trunk = addMesh(new THREE.CylinderGeometry(1.0, 1.4, 7, 6), trunkMat);
  trunk.position.y = 3.5;
  const cone1 = addMesh(new THREE.ConeGeometry(6, 10, 7), leafMat);
  cone1.position.y = 11;
  const cone2 = addMesh(new THREE.ConeGeometry(4.6, 8, 7), leafMat);
  cone2.position.y = 16;
  tree.add(trunk, cone1, cone2);
  scene.add(tree);
}

// ---------------------------------------------------------------------------
// Clouds: 8 puffy clouds, 5 overlapping spheres each, drifting +x
// ---------------------------------------------------------------------------
const CLOUD_PUFFS = [
  [0, 0, 0, 1.0],
  [9, -1, 2, 0.75],
  [-9, -1.5, -1, 0.7],
  [4, 3, -2, 0.6],
  [-4, 2.5, 1, 0.55],
];
const clouds = [];
for (let i = 0; i < 8; i++) {
  const cloud = new THREE.Group();
  const angle = rand() * Math.PI * 2;
  const radius = randRange(420, 920);
  cloud.position.set(Math.cos(angle) * radius, randRange(190, 330), Math.sin(angle) * radius);
  cloud.scale.set(1.6, 0.7, 1);
  cloud.userData.speed = randRange(5, 11);
  for (const [ox, oy, oz, s] of CLOUD_PUFFS) {
    const puff = addMesh(
      new THREE.SphereGeometry(7 * s, 12, 8),
      cloudMat,
      { cast: false, receive: false, outlineMat: cloudOutlineMat }
    );
    puff.position.set(ox, oy, oz);
    cloud.add(puff);
  }
  scene.add(cloud);
  clouds.push(cloud);
}

// ---------------------------------------------------------------------------
// Time of day switching
// ---------------------------------------------------------------------------
function syncFogUniforms() {
  for (const m of allMats) {
    scene.fog.color.getRGB(m.uniforms.fogColor.value, renderer.outputColorSpace);
    m.uniforms.fogNear.value = scene.fog.near;
    m.uniforms.fogFar.value = scene.fog.far;
  }
}

function applyTimeOfDay(name) {
  const T = TIMES[name];
  scene.background.setHex(T.sky);
  scene.fog.color.setHex(T.sky);

  light.position.copy(T.sunDir).multiplyScalar(600);
  light.position.y += 100;
  lightTarget.position.set(0, 100, 0);
  lightTarget.updateMatrixWorld();
  light.updateMatrixWorld();

  for (const m of toonMats) {
    m.uniforms.uPalette.value = paletteTextures[m.userData.matName][name];
    m.uniforms.uLightDir.value.copy(T.sunDir);
    m.uniforms.uShadowStrength.value = T.shadowStrength;
  }
  for (const m of outlineMats) {
    m.uniforms.uColor.value.setHex(T.outline);
    m.uniforms.uShadowStrength.value = T.shadowStrength;
  }
  syncFogUniforms();
  renderer.shadowMap.needsUpdate = true;

  for (const btn of document.querySelectorAll('#tod button')) {
    btn.classList.toggle('active', btn.dataset.tod === name);
  }
}

// ---------------------------------------------------------------------------
// UI: pill buttons + deep link (?tod=)
// ---------------------------------------------------------------------------
for (const btn of document.querySelectorAll('#tod button')) {
  btn.addEventListener('click', () => applyTimeOfDay(btn.dataset.tod));
}

const todParam = new URLSearchParams(location.search).get('tod');
const initialTOD = todParam && TIMES[todParam.toLowerCase()] ? todParam.toLowerCase() : 'day';
applyTimeOfDay(initialTOD);

// ---------------------------------------------------------------------------
// Resize
// ---------------------------------------------------------------------------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  for (const m of outlineMats) {
    m.uniforms.uViewportH.value = window.innerHeight;
  }
});

// ---------------------------------------------------------------------------
// Animation
// ---------------------------------------------------------------------------
const clock = new THREE.Timer();
renderer.setAnimationLoop(() => {
  clock.update();
  const dt = Math.min(clock.getDelta(), 0.1);
  controls.update(dt);
  for (const c of clouds) {
    c.position.x += c.userData.speed * dt;
    if (c.position.x > 1200) c.position.x -= 2400;
  }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
