<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ------------------------------------------------------------------ */
/* Seeded randomness — the room looks the same on every load          */
/* ------------------------------------------------------------------ */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(0xC0FFEE);
const rand = (a, b) => a + rng() * (b - a);
const pick = arr => arr[Math.floor(rng() * arr.length)];

/* ------------------------------------------------------------------ */
/* Renderer / scene                                                   */
/* ------------------------------------------------------------------ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb6c3d2);
scene.fog = new THREE.Fog(0xb6c3d2, 16, 45);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

/* ------------------------------------------------------------------ */
/* Canvas-texture helpers (all textures generated in code)            */
/* ------------------------------------------------------------------ */
function canvasTex(w, h, draw, repX = 1, repY = 1) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repX, repY);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

/* Oak plank floor, planks running east–west */
const floorTex = canvasTex(512, 512, (g, w, h) => {
  const rows = 8, rh = h / rows;
  for (let r = 0; r < rows; r++) {
    g.fillStyle = `hsl(${28 + rng() * 7},${36 + rng() * 10}%,${42 + rng() * 9}%)`;
    g.fillRect(0, r * rh, w, rh);
    g.strokeStyle = 'rgba(70,45,22,0.22)';
    for (let i = 0; i < 7; i++) {
      g.lineWidth = 0.5 + rng() * 0.9;
      g.beginPath();
      let y = r * rh + rng() * rh;
      g.moveTo(0, y);
      for (let x = 0; x <= w; x += 32) g.lineTo(x, y + Math.sin(x * 0.02 + rng() * 6) * 2.2);
      g.stroke();
    }
    g.fillStyle = 'rgba(38,24,12,0.75)';
    g.fillRect(0, r * rh, w, 2);
    const joints = 1 + Math.floor(rng() * 2);
    for (let j = 0; j < joints; j++) g.fillRect(rng() * w, r * rh, 2, rh);
  }
}, 3, 2.25);

/* Brick for the chimney breast */
const brickTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#b4a491'; g.fillRect(0, 0, w, h);
  const bh = 40, bw = 104;
  for (let r = 0; r * bh < h + bh; r++) {
    const off = (r % 2) * bw / 2;
    for (let x = -bw; x < w + bw; x += bw) {
      g.fillStyle = `hsl(${12 + rng() * 10},${30 + rng() * 14}%,${34 + rng() * 10}%)`;
      g.fillRect(x + off + 3, r * bh + 3, bw - 6, bh - 6);
    }
  }
  for (let i = 0; i < 2200; i++) {
    g.fillStyle = `rgba(0,0,0,${rng() * 0.06})`;
    g.fillRect(rng() * w, rng() * h, 2, 2);
  }
}, 1.6, 3.2);

/* Persian-ish rug */
const rugTex = canvasTex(512, 880, (g, w, h) => {
  g.fillStyle = '#6e2a23'; g.fillRect(0, 0, w, h);
  const bx = w / 2, by = h / 2;
  for (let i = 0; i < 6; i++) for (let j = 0; j < 10; j++) {
    const cx = 70 + i * (w - 140) / 5, cy = 70 + j * (h - 140) / 9;
    const s = 26 + (i + j) % 2 * 10;
    g.beginPath();
    g.moveTo(cx, cy - s); g.lineTo(cx + s * 0.7, cy); g.lineTo(cx, cy + s); g.lineTo(cx - s * 0.7, cy);
    g.closePath();
    g.fillStyle = (i + j) % 2 ? 'rgba(206,164,92,0.55)' : 'rgba(58,74,88,0.55)';
    g.fill();
    g.strokeStyle = 'rgba(232,214,176,0.5)'; g.lineWidth = 2; g.stroke();
  }
  const b = 48;
  g.fillStyle = '#31404b';
  g.fillRect(0, 0, w, b); g.fillRect(0, h - b, w, b);
  g.fillRect(0, 0, b, h); g.fillRect(w - b, 0, b, h);
  g.strokeStyle = '#cfa25e'; g.lineWidth = 4;
  g.strokeRect(b * 0.4, b * 0.4, w - b * 0.8, h - b * 0.8);
  g.strokeStyle = '#d8c49a'; g.lineWidth = 2;
  g.strokeRect(b * 0.62, b * 0.62, w - b * 1.24, h - b * 1.24);
  g.strokeStyle = 'rgba(206,164,92,0.8)'; g.lineWidth = 3;
  g.strokeRect(b + 14, b + 14, w - 2 * b - 28, h - 2 * b - 28);
  for (let i = 0; i < 4000; i++) {
    g.fillStyle = `rgba(${rng() > 0.5 ? '0,0,0' : '255,240,210'},${rng() * 0.05})`;
    g.fillRect(rng() * w, rng() * h, 2, 2);
  }
});
rugTex.repeat.set(1, 1);

/* Small landscape painting */
const artTex = canvasTex(256, 320, (g, w, h) => {
  const sky = g.createLinearGradient(0, 0, 0, h * 0.6);
  sky.addColorStop(0, '#d8b46a'); sky.addColorStop(1, '#e8cf9a');
  g.fillStyle = sky; g.fillRect(0, 0, w, h * 0.6);
  g.fillStyle = '#8a6a4a';
  g.beginPath(); g.moveTo(0, h * 0.62);
  g.lineTo(w * 0.3, h * 0.4); g.lineTo(w * 0.55, h * 0.6); g.lineTo(w * 0.8, h * 0.45); g.lineTo(w, h * 0.6);
  g.lineTo(w, h); g.lineTo(0, h); g.closePath(); g.fill();
  g.fillStyle = '#4a5238';
  g.beginPath(); g.moveTo(0, h * 0.75);
  g.lineTo(w * 0.4, h * 0.62); g.lineTo(w, h * 0.78); g.lineTo(w, h); g.lineTo(0, h);
  g.closePath(); g.fill();
  g.fillStyle = '#3a4030';
  g.beginPath(); g.ellipse(w * 0.25, h * 0.9, 60, 26, 0, 0, Math.PI * 2); g.fill();
  for (let i = 0; i < 900; i++) {
    g.fillStyle = `rgba(40,30,20,${rng() * 0.05})`;
    g.fillRect(rng() * w, rng() * h, 2, 2);
  }
});

/* ------------------------------------------------------------------ */
/* Materials                                                          */
/* ------------------------------------------------------------------ */
const M = {
  floor: new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.55, metalness: 0 }),
  wall: new THREE.MeshStandardMaterial({ color: 0xe9dcc2, roughness: 0.95 }),
  ceil: new THREE.MeshStandardMaterial({ color: 0xf0e8d6, roughness: 0.95 }),
  trim: new THREE.MeshStandardMaterial({ color: 0xf2ead8, roughness: 0.8 }),
  woodDark: new THREE.MeshStandardMaterial({ color: 0x4c3826, roughness: 0.65 }),
  woodMid: new THREE.MeshStandardMaterial({ color: 0x6e5138, roughness: 0.7 }),
  shelfWood: new THREE.MeshStandardMaterial({ color: 0x5a4230, roughness: 0.72 }),
  brick: new THREE.MeshStandardMaterial({ map: brickTex, roughness: 0.95 }),
  stone: new THREE.MeshStandardMaterial({ color: 0x9a9186, roughness: 0.9 }),
  sofa: new THREE.MeshStandardMaterial({ color: 0x46604e, roughness: 0.95 }),
  sofaCushion: new THREE.MeshStandardMaterial({ color: 0x54704f, roughness: 0.95 }),
  leather: new THREE.MeshStandardMaterial({ color: 0x7c4a2c, roughness: 0.6 }),
  leatherDark: new THREE.MeshStandardMaterial({ color: 0x5c3720, roughness: 0.65 }),
  rugSide: new THREE.MeshStandardMaterial({ color: 0x4a1e1a, roughness: 1 }),
  linen: new THREE.MeshStandardMaterial({ color: 0xd6c5a0, roughness: 0.95, side: THREE.DoubleSide }),
  brass: new THREE.MeshStandardMaterial({ color: 0x9a7840, roughness: 0.35, metalness: 0.8 }),
  iron: new THREE.MeshStandardMaterial({ color: 0x33302c, roughness: 0.5, metalness: 0.6 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xd8ecf2, transparent: true, opacity: 0.16, roughness: 0.05, metalness: 0 }),
  firebox: new THREE.MeshStandardMaterial({ color: 0x17110c, roughness: 1, side: THREE.BackSide }),
  coal: new THREE.MeshStandardMaterial({ color: 0x2a130a, roughness: 0.9, emissive: 0xff4a14, emissiveIntensity: 1.4 }),
  book: new THREE.MeshStandardMaterial({ roughness: 0.85 }),
  paper: new THREE.MeshStandardMaterial({ color: 0xe8dfc8, roughness: 0.9 }),
};

function std(color, rough = 0.85) {
  return new THREE.MeshStandardMaterial({ color, roughness: rough });
}

function shadowify(root, cast = true, recv = true) {
  root.traverse(o => { if (o.isMesh) { o.castShadow = cast; o.receiveShadow = recv; } });
}
function box(w, h, d, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  return m;
}
function rbox(w, h, d, r, mat, x, y, z) {
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, r), mat);
  m.position.set(x, y, z);
  return m;
}

/* ================================================================== */
/* THE ROOM   x: -3(west)..3(east)   z: -2.25(north)..2.25(south)     */
/* ================================================================== */
const room = new THREE.Group();
scene.add(room);

/* Floor */
const floor = new THREE.Mesh(new THREE.PlaneGeometry(6, 4.5), M.floor);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
room.add(floor);

/* Ceiling (hidden in top view) */
const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(6, 4.5), M.ceil);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.y = 2.7;
ceiling.receiveShadow = true;
room.add(ceiling);

/* Walls — boxes; T = 0.15, inner faces flush with the room bounds */
const T = 0.15, H = 2.7;
function wallPiece(w, h, x, y, z, alongX = true) {
  const m = alongX ? box(w, h, T, M.wall, x, y, z) : box(T, h, w, M.wall, x, y, z);
  room.add(m);
  return m;
}
/* South wall (z = +2.25), door opening x 0.75..1.65, height 2.05 */
wallPiece(3.75, H, -1.125, H / 2, 2.25 + T / 2);
wallPiece(1.35, H, 2.325, H / 2, 2.25 + T / 2);
wallPiece(0.9, 0.57, 1.2, 2.415, 2.25 + T / 2);
/* North wall (z = -2.25), window x -0.8..0.8, y 0.9..2.1 */
wallPiece(2.2, H, -1.9, H / 2, -2.25 - T / 2);
wallPiece(2.2, H, 1.9, H / 2, -2.25 - T / 2);
wallPiece(1.6, 0.9, 0, 0.45, -2.25 - T / 2);
wallPiece(1.6, 0.6, 0, 2.4, -2.25 - T / 2);
/* East & west walls */
wallPiece(4.5 + 2 * T, H, 3 + T / 2, H / 2, 0, false);
wallPiece(4.5 + 2 * T, H, -3 - T / 2, H / 2, 0, false);
room.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
ceiling.castShadow = false;
floor.castShadow = false;

/* Skirting boards */
{
  const sk = 0.12, st = 0.018;
  const s = (w, x, z, alongX) => {
    const m = alongX ? box(w, sk, st, M.trim, x, sk / 2, z) : box(st, sk, w, M.trim, x, sk / 2, z);
    room.add(m);
  };
  s(3.75, -1.125, 2.25 - st / 2, true);            // south, west of door
  s(1.35, 2.325, 2.25 - st / 2, true);             // south, east of door
  s(4.5, 0, -2.25 + st / 2, true);                 // north
  s(1.9, 3 - st / 2, -1.475, false);               // east, north of hearth
  s(1.45, 3 - st / 2, 1.525, false);               // east, south of hearth
}

/* ------------------------------------------------------------------ */
/* Window — frame, mullions, glass, sill, curtains                    */
/* ------------------------------------------------------------------ */
{
  const g = new THREE.Group();
  const fd = 0.14, fz = -2.25;
  g.add(box(1.72, 0.08, fd, M.trim, 0, 0.92, fz));   // bottom rail
  g.add(box(1.72, 0.08, fd, M.trim, 0, 2.08, fz));   // top rail
  g.add(box(0.08, 1.28, fd, M.trim, -0.82, 1.5, fz));
  g.add(box(0.08, 1.28, fd, M.trim, 0.82, 1.5, fz));
  g.add(box(0.05, 1.2, 0.06, M.trim, 0, 1.5, fz));   // mullions
  g.add(box(1.6, 0.05, 0.06, M.trim, 0, 1.5, fz));
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 1.2), M.glass);
  glass.position.set(0, 1.5, fz);
  g.add(glass);
  g.add(box(1.9, 0.05, 0.22, M.trim, 0, 0.875, fz + 0.03)); // sill board
  shadowify(g);
  glass.castShadow = false;
  room.add(g);

  /* Curtain rod + linen curtains */
  const c = new THREE.Group();
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 2.7, 10), M.brass);
  rod.rotation.z = Math.PI / 2;
  rod.position.set(0, 2.26, -2.1);
  c.add(rod);
  for (const sx of [-1, 1]) {
    const knob = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 10), M.brass);
    knob.position.set(sx * 1.36, 2.26, -2.1);
    c.add(knob);
    const geo = new THREE.PlaneGeometry(0.5, 1.55, 14, 1);
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      pos.setZ(i, Math.sin(x * 18) * 0.035 + Math.sin(x * 7) * 0.02);
    }
    geo.computeVertexNormals();
    const p = new THREE.Mesh(geo, M.linen);
    p.position.set(sx * 1.06, 1.44, -2.08);
    c.add(p);
  }
  shadowify(c);
  room.add(c);

  /* Little plant on the sill */
  const p = new THREE.Group();
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.038, 0.1, 12), std(0x9c5232, 0.9));
  pot.position.y = 0.05;
  p.add(pot);
  for (let i = 0; i < 7; i++) {
    const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.018, rand(0.09, 0.16), 6), std(0x3f6134, 0.9));
    const a = rand(0, Math.PI * 2), rr = rand(0, 0.03);
    leaf.position.set(Math.cos(a) * rr, 0.1 + rand(0.03, 0.09), Math.sin(a) * rr);
    leaf.rotation.set(rand(-0.5, 0.5), 0, rand(-0.5, 0.5));
    p.add(leaf);
  }
  p.position.set(0.55, 0.9, -2.2);
  shadowify(p);
  room.add(p);
}

/* ------------------------------------------------------------------ */
/* Door — south wall, hinged west (x=0.75), opens into the room       */
/* ------------------------------------------------------------------ */
{
  const frame = new THREE.Group();
  frame.add(box(0.09, 2.14, 0.2, M.trim, 0.735, 1.07, 2.25));
  frame.add(box(0.09, 2.14, 0.2, M.trim, 1.665, 1.07, 2.25));
  frame.add(box(1.02, 0.09, 0.2, M.trim, 1.2, 2.095, 2.25));
  shadowify(frame);
  room.add(frame);

  const leaf = new THREE.Group();
  leaf.position.set(0.75, 0, 2.25);
  leaf.rotation.y = THREE.MathUtils.degToRad(78);   // open into the room, swing arc clear
  const doorWood = std(0x6b4a30, 0.6);
  const panel = rbox(0.9, 2.03, 0.05, 0.012, doorWood, 0.45, 1.015, 0);
  leaf.add(panel);
  const inset = std(0x5a3c26, 0.65);
  leaf.add(box(0.6, 0.75, 0.015, inset, 0.45, 0.62, 0.028));
  leaf.add(box(0.6, 0.75, 0.015, inset, 0.45, 0.62, -0.028));
  leaf.add(box(0.6, 0.42, 0.015, inset, 0.45, 1.62, 0.028));
  leaf.add(box(0.6, 0.42, 0.015, inset, 0.45, 1.62, -0.028));
  for (const s of [1, -1]) {
    const knob = new THREE.Mesh(new THREE.SphereGeometry(0.032, 14, 12), M.brass);
    knob.position.set(0.82, 1.02, s * 0.045);
    leaf.add(knob);
  }
  shadowify(leaf);
  room.add(leaf);
}

/* ------------------------------------------------------------------ */
/* Fireplace — east wall, centred, 1 m opening                        */
/* ------------------------------------------------------------------ */
const fireGroup = new THREE.Group();
{
  /* chimney breast: piers + lintel around the opening (z -0.5..0.5, y 0..0.85) */
  fireGroup.add(box(0.25, H, 0.2, M.brick, 2.875, H / 2, -0.6));
  fireGroup.add(box(0.25, H, 0.2, M.brick, 2.875, H / 2, 0.6));
  fireGroup.add(box(0.25, H - 0.85, 1.0, M.brick, 2.875, 0.85 + (H - 0.85) / 2, 0));
  /* dark firebox interior */
  const inner = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.84, 0.98), M.firebox);
  inner.position.set(2.885, 0.43, 0);
  fireGroup.add(inner);
  /* hearth stone */
  fireGroup.add(box(0.3, 0.05, 1.6, M.stone, 2.85, 0.025, 0));
  /* wooden mantel shelf */
  fireGroup.add(rbox(0.36, 0.07, 1.56, 0.015, M.woodDark, 2.82, 1.16, 0));
  /* picture above the mantel */
  const pic = new THREE.Group();
  pic.add(box(0.03, 0.62, 0.78, M.woodDark, 0, 0, 0));
  const art = new THREE.Mesh(new THREE.PlaneGeometry(0.68, 0.52), new THREE.MeshStandardMaterial({ map: artTex, roughness: 0.9 }));
  art.rotation.y = -Math.PI / 2;
  art.position.x = -0.017;
  pic.add(art);
  pic.position.set(2.735, 1.78, 0);
  fireGroup.add(pic);
  /* candles on the mantel */
  for (const [cz, ch] of [[-0.55, 0.16], [-0.42, 0.11], [0.5, 0.14]]) {
    const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.025, ch, 10), M.paper);
    stick.position.set(2.8, 1.195 + ch / 2, cz);
    fireGroup.add(stick);
  }
  /* logs + glowing coals */
  const logMat = std(0x3a2a1c, 0.95);
  const l1 = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.06, 0.68, 9), logMat);
  l1.rotation.x = Math.PI / 2; l1.rotation.y = 0.35;
  l1.position.set(2.87, 0.12, 0);
  const l2 = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.055, 0.64, 9), logMat);
  l2.rotation.x = Math.PI / 2; l2.rotation.y = -0.4;
  l2.position.set(2.87, 0.2, 0.02);
  fireGroup.add(l1, l2);
  for (let i = 0; i < 9; i++) {
    const coal = new THREE.Mesh(new THREE.SphereGeometry(rand(0.025, 0.045), 8, 6), M.coal);
    coal.position.set(rand(2.8, 2.95), rand(0.05, 0.14), rand(-0.3, 0.3));
    fireGroup.add(coal);
  }
  shadowify(fireGroup);
  room.add(fireGroup);
}

/* Flames + firelight (animated) */
const flameMat = (c, o) => new THREE.MeshBasicMaterial({
  color: c, transparent: true, opacity: o,
  blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
});
function flame(r, h, c, o) {
  const geo = new THREE.ConeGeometry(r, h, 10);
  geo.translate(0, h / 2, 0);
  const m = new THREE.Mesh(geo, flameMat(c, o));
  m.userData.p = rng() * Math.PI * 2;
  return m;
}
const flames = [];
{
  const defs = [
    [0.16, 0.5, 0xff5a00, 0.4, -0.05, 0],
    [0.13, 0.42, 0xff6a10, 0.5, 0.07, 0.04],
    [0.1, 0.36, 0xff8a20, 0.55, -0.08, -0.05],
    [0.09, 0.3, 0xff9c30, 0.6, 0.03, -0.07],
    [0.08, 0.26, 0xffb050, 0.65, 0.1, -0.03],
    [0.07, 0.24, 0xffc46a, 0.7, -0.03, 0.06],
    [0.05, 0.18, 0xfff0b8, 0.85, 0, 0],
    [0.04, 0.15, 0xfff6d8, 0.9, 0.06, 0.03],
  ];
  for (const [r, h, c, o, dx, dz] of defs) {
    const f = flame(r, h, c, o);
    f.position.set(2.86 + dx, 0.14, dz);
    flames.push(f);
  }
}
flames.forEach(f => room.add(f));

const fireLight = new THREE.PointLight(0xff8033, 10, 9, 2);
fireLight.position.set(2.78, 0.55, 0);
fireLight.castShadow = true;
fireLight.shadow.mapSize.set(512, 512);
fireLight.shadow.bias = -0.004;
fireLight.shadow.camera.near = 0.05;
fireLight.shadow.camera.far = 8;
room.add(fireLight);

/* ------------------------------------------------------------------ */
/* Rug — centred under the coffee table, under the sofa's front legs  */
/* ------------------------------------------------------------------ */
{
  const rug = new THREE.Mesh(
    new THREE.BoxGeometry(1.46, 0.024, 2.5),

/* ------------------------------------------------------------------ */
/* Bookshelf — floor to ceiling, covering the west wall               */
/* (the door's swing arc never reaches x=-3, so full coverage is safe)*/
/* ------------------------------------------------------------------ */
{
  const shelf = new THREE.Group();
  const D = 0.32, X0 = -3, X1 = -2.68, xc = -2.84;
  /* plinth, sides, top, bottom, back */
  shelf.add(box(D + 0.04, 0.05, 4.5, M.shelfWood, xc - 0.02, 0.025, 0));
  shelf.add(box(D, 2.7, 0.035, M.shelfWood, xc, 1.35, -2.2325));
  shelf.add(box(D, 2.7, 0.035, M.shelfWood, xc, 1.35, 2.2325));
  shelf.add(box(D, 0.035, 4.5, M.shelfWood, xc, 2.6825, 0));
  shelf.add(box(D, 0.03, 4.5, M.shelfWood, xc, 0.065, 0));
  shelf.add(box(0.02, 2.7, 4.5, M.shelfWood, X0 + 0.01, 1.35, 0));
  const boardYs = [0.55, 1.0, 1.45, 1.9, 2.32];
  for (const y of boardYs) shelf.add(box(D - 0.02, 0.025, 4.42, M.shelfWood, xc, y, 0));
  room.add(shelf);

  /* books — instanced */
  const palette = [0x8a3b2c, 0x41597a, 0xc9a15a, 0x54476b, 0x3f5d50, 0xa34a3c,
    0x7c6a54, 0x96382e, 0x2f4a44, 0xb0763f, 0x6b4a72, 0x4a6b5a, 0x94553f, 0x5a6e46];
  const compartments = [];
  const bs = [0.075, ...boardYs, 2.665];
  for (let i = 0; i < bs.length - 1; i++) {
    const base = bs[i] + 0.02, top = bs[i + 1] - 0.03;
    if (top - base > 0.22) compartments.push([base, top]);
  }
  const items = [];   // {y, z, dx, h, w, d, color, rotY}
  for (const [base, top] of compartments) {
    let z = -2.14;
    while (z < 2.05) {
      const r = rng();
      if (r < 0.06) { z += rand(0.1, 0.3); continue; }              // a gap
      if (r < 0.1 && z > -1.9) {                                     // small stack lying flat
        let sy = base, n = 2 + Math.floor(rng() * 2);
        for (let k = 0; k < n && sy + 0.045 < top; k++) {
          items.push({ y: sy + 0.019, z: z + 0.13, dx: rand(-0.02, 0.02), h: 0.038, w: 0.25, d: rand(0.16, 0.2), color: pick(palette), rotY: rand(-0.08, 0.08) });
          sy += 0.042;
        }
        z += 0.3;
        continue;
      }
      const w = rand(0.026, 0.055);
      const h = Math.min(rand(0.26, 0.4), top - base);
      items.push({ y: base + h / 2, z: z + w / 2, dx: rand(-0.015, 0.015), h, w, d: rand(0.15, 0.22), color: pick(palette), rotY: 0 });
      z += w + rand(0.001, 0.006);
    }
  }
  const bookGeo = new THREE.BoxGeometry(1, 1, 1);
  const books = new THREE.InstancedMesh(bookGeo, M.book, items.length);
  const dummy = new THREE.Object3D();
  const col = new THREE.Color();
  items.forEach((b, i) => {
    dummy.position.set(xc + b.dx, b.y, b.z);
    dummy.rotation.set(0, b.rotY, 0);
    dummy.scale.set(b.d, b.h, b.w);
    dummy.updateMatrix();
    books.setMatrixAt(i, dummy.matrix);
    col.setHex(b.color).offsetHSL(0, rand(-0.05, 0.05), rand(-0.06, 0.06));
    books.setColorAt(i, col);
  });
  books.castShadow = true;
  books.receiveShadow = true;
  room.add(books);
}

/* ================================================================== */
/* Cameras & controls                                                 */
/* ================================================================== */
const params = new URLSearchParams(location.search);
const topView = params.get('view') === 'top';

const persp = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.05, 120);
persp.position.set(1.2, 1.6, 2.0);            // just inside the door, eye height
persp.lookAt(3.0, 1.0, -0.8);                 // looking north-east into the room

const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 80);
ortho.position.set(0, 25, 0);
ortho.up.set(0, 0, -1);                       // north up
ortho.lookAt(0, 0, 0);

function fitOrtho() {
  const a = innerWidth / innerHeight;
  let hh = Math.max(2.75, 3.5 / a);
  ortho.left = -hh * a; ortho.right = hh * a;
  ortho.top = hh; ortho.bottom = -hh;
  ortho.updateProjectionMatrix();
}
fitOrtho();

const controls = new OrbitControls(persp, renderer.domElement);
controls.target.set(3.0, 1.0, -0.8);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.3;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.52;

const topControls = new OrbitControls(ortho, renderer.domElement);
topControls.target.set(0, 0, 0);
topControls.enableDamping = true;
topControls.dampingFactor = 0.08;
topControls.minZoom = 0.5;
topControls.maxZoom = 4;

controls.enabled = !topView;
topControls.enabled = topView;

if (topView) {
  ceiling.visible = false;
  pendant.visible = false;
}

function onResize() {
  renderer.setSize(innerWidth, innerHeight);
  persp.aspect = innerWidth / innerHeight;
  persp.updateProjectionMatrix();
  fitOrtho();
}
addEventListener('resize', onResize);

/* ================================================================== */
/* Animate                                                            */
/* ================================================================== */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  /* flickering fire */
  const fl = 0.8 + 0.14 * Math.sin(t * 11.3) + 0.09 * Math.sin(t * 27.7 + 1.3) + 0.06 * Math.sin(t * 43.1 + 2.6);
  fireLight.intensity = 10 * fl;
  M.coal.emissiveIntensity = 1.2 + 0.5 * fl;
  flames.forEach(f => {
    const p = f.userData.p;
    const s = 0.9 + 0.18 * Math.sin(t * 9 + p) + 0.09 * Math.sin(t * 23 + p * 2);
    f.scale.set(1 + 0.12 * Math.sin(t * 13 + p), s, 1 + 0.12 * Math.sin(t * 17 + p * 1.7));
    f.position.x = 2.86 + 0.015 * Math.sin(t * 7 + p);
    f.rotation.y = t * 0.6 + p;
  });

  /* faint lamp breathing */
  lampLight.intensity = 5 * (1 + 0.03 * Math.sin(t * 2.1));

  if (topView) topControls.update(); else controls.update();
  renderer.render(scene, topView ? ortho : persp);
}
animate();
</script>
