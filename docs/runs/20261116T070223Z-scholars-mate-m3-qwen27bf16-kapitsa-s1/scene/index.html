<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scholar’s Mate — A 4-Move Trap</title>
<style>
  :root {
    --bg: #262421;
    --panel: #312e2b;
    --panel-2: #3d3935;
    --text: #e9e6e0;
    --muted: #a39c90;
    --accent: #81b64c;
    --gold: #f0c040;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "DejaVu Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #app { min-height: 100vh; display: flex; flex-direction: column; }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 14px 22px 10px;
  }
  h1 { font-size: 19px; margin: 0; font-weight: 700; letter-spacing: 0.2px; }
  .sub { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }
  #turnChip {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel); border-radius: 999px;
    padding: 7px 14px; font-size: 13px; font-weight: 600;
    white-space: nowrap;
  }
  #turnDot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #f0ede5; border: 1px solid rgba(0,0,0,0.45);
  }
  #turnChip.b #turnDot { background: #2b2823; border-color: rgba(255,255,255,0.3); }
  #turnChip.mate { color: var(--gold); box-shadow: inset 0 0 0 1px rgba(240,192,64,0.45); }
  #turnChip.mate #turnDot { background: var(--gold); border-color: transparent; }

  /* ---------- main layout ---------- */
  #main {
    flex: 1; display: flex; gap: 22px;
    padding: 6px 22px 22px;
    justify-content: center; align-items: flex-start;
  }
  #boardCol { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  #boardWrap {
    position: relative;
    width: clamp(280px, calc(100vh - 240px), 640px);
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    box-shadow: 0 12px 34px rgba(0,0,0,0.38);
    overflow: hidden;
    background: #35322c;
  }
  #gl { width: 100%; height: 100%; display: block; }

  #mateBanner {
    position: absolute; left: 50%; top: 14px;
    transform: translateX(-50%) translateY(-10px);
    background: rgba(22, 19, 15, 0.9);
    border: 1px solid rgba(240, 192, 64, 0.55);
    color: var(--gold);
    padding: 8px 20px; border-radius: 999px;
    font-weight: 700; font-size: 15px; letter-spacing: 0.3px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.5s ease, transform 0.5s ease;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
  }
  #mateBanner small { display: block; font-weight: 500; font-size: 11px; color: #d8c9a3; letter-spacing: 0.2px; }
  #mateBanner.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #mateBanner.delay { transition-delay: 0.8s; }

  /* ---------- captures tray ---------- */
  #captures { display: flex; gap: 12px; width: 100%; justify-content: center; flex-wrap: wrap; }
  .cap-row {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel); border-radius: 8px;
    padding: 4px 12px; min-height: 32px; min-width: 120px;
  }
  .cap-label {
    font-size: 10.5px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.9px; font-weight: 600;
  }
  .cap-piece { width: 20px; height: 20px; }
  .cap-none { font-size: 12px; color: #6d675e; }

  /* ---------- side panel ---------- */
  #panel { width: 400px; max-width: 400px; display: flex; flex-direction: column; gap: 14px; }
  #captionCard {
    background: var(--panel);
    border-radius: 12px;
    padding: 16px 18px;
    min-height: 138px;
  }
  #captionInner.swap { animation: capIn 0.45s cubic-bezier(0.2, 0.7, 0.3, 1); }
  @keyframes capIn {
    from { opacity: 0; transform: translateY(7px); }
    to { opacity: 1; transform: none; }
  }
  #captionTag { font-size: 15px; font-weight: 700; color: var(--gold); margin-bottom: 7px; letter-spacing: 0.2px; }
  #captionText { font-size: 15.5px; line-height: 1.52; color: var(--text); }

  /* ---------- progress ---------- */
  #progress {
    position: relative; height: 10px;
    background: var(--panel-2); border-radius: 999px;
    cursor: pointer; flex: none;
  }
  #progressFill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: var(--accent); border-radius: 999px;
  }
  .ptick { position: absolute; top: 2px; bottom: 2px; width: 2px; background: rgba(0,0,0,0.35); border-radius: 1px; }

  /* ---------- controls ---------- */
  #controls { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .ctl {
    width: 46px; height: 46px; border-radius: 50%;
    border: none; background: var(--panel-2); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
    transition: background 0.15s ease, transform 0.08s ease;
  }
  .ctl:hover { background: #4a4640; }
  .ctl:active { transform: scale(0.93); }
  .ctl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ctl svg { width: 20px; height: 20px; fill: currentColor; }
  #btnPlay { width: 58px; height: 58px; background: var(--accent); color: #1c2413; }
  #btnPlay:hover { background: #8fc75b; }
  #btnPlay svg { width: 26px; height: 26px; }
  #hint { text-align: center; font-size: 11px; color: #6d675e; margin-top: -4px; }

  /* ---------- move list ---------- */
  #moveListWrap { background: var(--panel); border-radius: 12px; padding: 12px 14px 14px; }
  #moveListWrap h2 {
    margin: 0 0 8px; font-size: 11px; text-transform: uppercase;
    letter-spacing: 1.1px; color: var(--muted); font-weight: 600;
  }
  #moveList { display: flex; flex-direction: column; gap: 2px; }
  .ml-row { display: grid; grid-template-columns: 32px 1fr 1fr; gap: 6px; align-items: center; }
  .ml-num { font-size: 13px; color: var(--muted); }
  .ml-cell {
    border: none; background: transparent; color: var(--text);
    font: inherit; font-size: 14.5px; font-weight: 600;
    text-align: left; padding: 7px 10px; border-radius: 8px; cursor: pointer;
    transition: background 0.12s ease;
  }
  .ml-cell:hover { background: rgba(255,255,255,0.07); }
  .ml-cell:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .ml-cell.empty { cursor: default; }
  .ml-cell.current { background: rgba(240, 192, 64, 0.16); color: var(--gold); }

  /* ---------- mobile ---------- */
  @media (max-width: 920px) {
    header { padding: 12px 16px 8px; }
    #main { flex-direction: column; align-items: center; padding: 4px 16px 24px; gap: 16px; }
    #boardWrap { width: min(100%, calc(100vw - 32px)); }
    #panel { width: 100%; max-width: 560px; }
    #captionCard { min-height: 0; }
    #hint { display: none; }
    #mateBanner { top: 8px; font-size: 13px; padding: 6px 14px; }
    #mateBanner small { font-size: 10px; }
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "../../../vendor/three/build/three.module.js",
    "three/addons/": "../../../vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
  <div id="app">
    <header>
      <div>
        <h1>Scholar’s Mate</h1>
        <p class="sub">The classic 4-move trap · shown from Black’s side</p>
      </div>
      <div id="turnChip"><span id="turnDot"></span><span id="turnLabel">White to move</span></div>
    </header>
    <main id="main">
      <section id="boardCol">
        <div id="boardWrap">
          <canvas id="gl"></canvas>
          <div id="mateBanner">Checkmate<small>Black is mated in 4</small></div>
        </div>
        <div id="captures">
          <div class="cap-row"><span class="cap-label">White</span><span id="capW" class="cap-pieces"><span class="cap-none">—</span></span></div>
          <div class="cap-row"><span class="cap-label">Black</span><span id="capB" class="cap-pieces"><span class="cap-none">—</span></span></div>
        </div>
      </section>
      <aside id="panel">
        <div id="captionCard">
          <div id="captionInner">
            <div id="captionTag"></div>
            <div id="captionText"></div>
          </div>
        </div>
        <div id="progress"><div id="progressFill"></div></div>
        <div id="controls">
          <button id="btnPrev" class="ctl" aria-label="Previous move"></button>
          <button id="btnPlay" class="ctl" aria-label="Play"></button>
          <button id="btnNext" class="ctl" aria-label="Next move"></button>
          <button id="btnReplay" class="ctl" aria-label="Replay lesson"></button>
        </div>
        <div id="hint">Space play/pause · ← → step · R replay</div>
        <div id="moveListWrap">
          <h2>Moves</h2>
          <div id="moveList"></div>
        </div>
      </aside>
    </main>
  </div>
  <script type="module" src="./lesson.js"></script>
</body>
</html>
