<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Tour Eiffel — Toon Adventure</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#87ceeb; }
  canvas { display:block; }
  #vignette{
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(25,12,40,0.28) 100%);
  }
  #title{
    position:fixed; top:18px; left:22px; z-index:10; pointer-events:none;
    color:#fffdf4; font-family:"Trebuchet MS", "Verdana", sans-serif;
    text-shadow:0 2px 0 #241a2e, 0 0 14px rgba(0,0,0,0.35);
  }
  #title h1{ margin:0; font-size:26px; letter-spacing:4px; font-weight:800; }
  #title p{ margin:4px 0 0 2px; font-size:12.5px; letter-spacing:1px; opacity:0.92; }
  #hud{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    display:flex; gap:10px; z-index:10;
  }
  #hud button{
    font-family:"Trebuchet MS","Verdana",sans-serif;
    font-size:15px; font-weight:800; letter-spacing:1px;
    padding:10px 18px; border-radius:999px;
    border:3px solid #241a2e; background:#fff8ec; color:#241a2e;
    cursor:pointer; box-shadow:0 4px 0 #241a2e;
    transition:transform .12s, box-shadow .12s, background .12s;
  }
  #hud button:hover{ background:#ffefc9; }
  #hud button.active{
    background:#ffd257; transform:translateY(3px); box-shadow:0 1px 0 #241a2e;
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "../../../vendor/three/build/three.module.js",
    "three/addons/": "../../../vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="title">
  <h1>LA TOUR EIFFEL</h1>
  <p>drag to orbit &nbsp;·&nbsp; scroll to zoom &nbsp;·&nbsp; keys 1 / 2 / 3</p>
</div>
<div id="hud">
  <button data-mode="day">☀ Day</button>
  <button data-mode="dusk">🌇 Dusk</button>
  <button data-mode="night">🌙 Night</button>
</div>
<div id="vignette"></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
