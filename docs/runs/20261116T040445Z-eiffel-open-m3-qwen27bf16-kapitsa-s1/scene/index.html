<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>La Tour Eiffel — a toon postcard</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0a102e;
  }
  canvas { display: block; }
  #hud {
    position: fixed;
    top: 18px;
    left: 20px;
    z-index: 10;
    font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
    user-select: none;
  }
  #title {
    font-size: 30px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 0 rgba(30, 20, 10, 0.55), 0 0 18px rgba(0, 0, 0, 0.25);
  }
  #sub {
    font-size: 13px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.85);
    text-shadow: 0 1px 0 rgba(30, 20, 10, 0.5);
    margin-top: 2px;
  }
  #modes { display: flex; gap: 10px; margin-top: 14px; }
  .mode {
    font: inherit;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.4px;
    padding: 8px 18px;
    border-radius: 12px;
    cursor: pointer;
    color: #33221a;
    background: rgba(255, 255, 255, 0.92);
    border: 3px solid #33221a;
    box-shadow: 0 3px 0 #33221a;
    transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.2s;
  }
  .mode:hover { transform: translateY(-1px); box-shadow: 0 4px 0 #33221a; }
  .mode:active { transform: translateY(2px); box-shadow: 0 1px 0 #33221a; }
  .mode.on { outline: 3px solid rgba(255, 255, 255, 0.75); outline-offset: 1px; }
  #hint {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    font: 700 13px 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
    color: rgba(255, 255, 255, 0.9);
    text-shadow: 0 1px 0 rgba(30, 20, 10, 0.6);
    background: rgba(20, 14, 8, 0.35);
    padding: 7px 16px;
    border-radius: 999px;
    transition: opacity 1s ease;
    pointer-events: none;
    z-index: 10;
  }
  #hint.hidden { opacity: 0; }
  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 55%, rgba(15, 8, 25, 0.28) 100%);
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "../../../vendor/three/build/three.module.js",
    "three/addons/": "../../../vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">
  <div id="title">La Tour Eiffel</div>
  <div id="sub">a toon postcard of Paris</div>
  <div id="modes">
    <button class="mode" data-mode="day">Day</button>
    <button class="mode" data-mode="dusk">Dusk</button>
    <button class="mode" data-mode="night">Night</button>
  </div>
</div>
<div id="hint">drag to orbit &nbsp;&middot;&nbsp; scroll to zoom</div>
<div id="vignette"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
