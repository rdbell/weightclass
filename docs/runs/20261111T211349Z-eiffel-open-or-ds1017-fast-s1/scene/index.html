<!DOCTYPE html>
<html lang="en" data-mode="day">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#7bd2f6" />
  <title>La Tour Eiffel — A Cel-Shaded Adventure</title>
  <style>
    :root {
      --ink: #2a2231;
      --paper: #f8edd7;
      --paper-deep: #efdfc0;
      --shadow: rgba(42, 34, 49, 0.20);
      --accent: #ffd45e;
      --accent-ink: #46311c;
    }
    :root[data-mode="dusk"] {
      --paper: #f9e4d2;
      --paper-deep: #f0cdb5;
      --accent: #ff9a6b;
      --accent-ink: #4b2418;
      --ink: #2e2030;
    }
    :root[data-mode="night"] {
      --paper: #f3e7cf;
      --paper-deep: #e6d5b6;
      --accent: #4a5c95;
      --accent-ink: #f6efdd;
      --ink: #1d2138;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #8fd5f4;
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    #app, #app canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #app canvas {
      cursor: grab;
      outline: none;
      touch-action: none;
    }
    body.dragging #app canvas { cursor: grabbing; }

    /* gentle vignette / paper edge */
    #app::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 46%, rgba(255,255,255,0) 50%, rgba(37, 24, 43, 0.12) 82%, rgba(31, 19, 38, 0.28) 100%);
      transition: background 1s ease;
      z-index: 2;
    }
    :root[data-mode="dusk"] #app::after {
      background:
        radial-gradient(ellipse at 50% 46%, rgba(255,200,150,0) 48%, rgba(50, 24, 47, 0.16) 82%, rgba(35, 16, 37, 0.34) 100%);
    }
    :root[data-mode="night"] #app::after {
      background:
        radial-gradient(ellipse at 50% 42%, rgba(150,180,255,0.05) 38%, rgba(6, 9, 25, 0.28) 82%, rgba(3, 5, 16, 0.55) 100%);
    }

    .hud {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(16px, 2.6vw, 34px);
    }

    .brand {
      align-self: flex-start;
      max-width: min(390px, 82vw);
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: 18px 20px 16px 22px;
      padding: clamp(14px, 2vw, 21px) clamp(18px, 2.6vw, 28px) clamp(13px, 1.8vw, 18px);
      box-shadow: 6px 7px 0 var(--shadow);
      transform: rotate(-1.3deg);
      transition: background 0.9s ease, border-color 0.9s ease, box-shadow 0.9s ease;
      position: relative;
      overflow: hidden;
    }
    .brand::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(0deg, rgba(120, 90, 60, 0.035) 0 1px, transparent 1px 3px);
      pointer-events: none;
      opacity: 0.6;
    }
    .overline {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(9px, 0.9vw, 11px);
      font-weight: 800;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(42, 34, 49, 0.72);
      position: relative;
    }
    .overline .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      border: 1.5px solid var(--ink);
      transition: background 0.9s ease;
    }
    .brand h1 {
      margin: 7px 0 3px;
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
      font-weight: 700;
      font-size: clamp(30px, 3.8vw, 48px);
      line-height: 0.92;
      letter-spacing: -0.025em;
      color: var(--ink);
      position: relative;
    }
    .brand .sub {
      margin: 8px 0 0;
      font-family: Georgia, "Iowan Old Style", serif;
      font-style: italic;
      font-size: clamp(12px, 1.2vw, 15px);
      color: rgba(42, 34, 49, 0.8);
      position: relative;
    }
    .tricolor {
      position: relative;
      display: flex;
      height: 5px;
      width: 74px;
      margin-top: 13px;
      border: 1.5px solid var(--ink);
      border-radius: 3px;
      overflow: hidden;
    }
    .tricolor span { flex: 1; }
    .tricolor span:nth-child(1) { background: #30549a; }
    .tricolor span:nth-child(2) { background: #f6f0df; }
    .tricolor span:nth-child(3) { background: #c83d47; }

    .bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      width: 100%;
    }
    .mode-wrap {
      position: absolute;
      left: 50%;
      bottom: clamp(18px, 3.4vw, 40px);
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    .mode-label {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.28em;
      color: rgba(255, 255, 255, 0.88);
      text-shadow: 0 1px 3px rgba(20, 10, 30, 0.55);
      padding-left: 0.28em;
      user-select: none;
    }
    .mode-switch {
      pointer-events: auto;
      display: flex;
      gap: 4px;
      padding: 5px;
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: 15px;
      box-shadow: 5px 6px 0 var(--shadow);
      transition: background 0.9s ease, border-color 0.9s ease, box-shadow 0.9s ease;
    }
    .mode-btn {
      appearance: none;
      border: 2px solid transparent;
      background: transparent;
      color: var(--ink);
      border-radius: 10px;
      padding: 8px 14px 7px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: background 0.25s ease, color 0.25s ease, transform 0.18s ease, border-color 0.25s ease;
      outline: none;
    }
    .mode-btn svg {
      width: 18px;
      height: 18px;
      display: block;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .mode-btn:hover { background: rgba(42, 34, 49, 0.07); }
    .mode-btn:active { transform: translateY(1px) scale(0.98); }
    .mode-btn:focus-visible { border-color: var(--ink); }
    .mode-btn.active {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--ink);
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.12);
    }
    .mode-btn.active svg { stroke-width: 2.2; }

    .hint {
      margin-left: auto;
      pointer-events: none;
      background: color-mix(in srgb, var(--paper) 88%, transparent);
      border: 1.5px solid var(--ink);
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(42, 34, 49, 0.75);
      box-shadow: 3px 3px 0 var(--shadow);
      white-space: nowrap;
      transition: background 0.9s ease, border-color 0.9s ease;
    }
    .hint b { color: var(--ink); font-weight: 900; }
    .hint .sep { opacity: 0.45; padding: 0 5px; }

    #veil {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7ecd7;
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }
    #veil.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .veil-inner { text-align: center; color: #2a2231; }
    .veil-inner .kicker {
      font-size: 10px;
      letter-spacing: 0.34em;
      font-weight: 800;
      text-transform: uppercase;
      opacity: 0.62;
    }
    .veil-inner h1 {
      margin: 10px 0 9px;
      font-family: Georgia, "Iowan Old Style", serif;
      font-size: clamp(34px, 5vw, 62px);
      letter-spacing: -0.03em;
    }
    .veil-inner .loadline {
      width: 120px;
      height: 3px;
      margin: 20px auto 0;
      background: rgba(42, 34, 49, 0.15);
      border-radius: 3px;
      overflow: hidden;
    }
    .veil-inner .loadline::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      background: #2a2231;
      border-radius: 3px;
      animation: load 1.1s ease-in-out infinite;
    }
    @keyframes load {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(260%); }
    }

    @media (max-width: 1100px) {
      .hint { display: none; }
    }
    @media (max-width: 640px) {
      .brand {
        transform: rotate(-1deg);
        max-width: 80vw;
        padding: 9px 14px 10px;
        border-radius: 13px 15px 12px 16px;
        box-shadow: 4px 5px 0 var(--shadow);
      }
      .brand h1 { font-size: 24px; margin: 4px 0 0; }
      .brand .sub, .brand .tricolor { display: none; }
      .brand .overline { font-size: 7.5px; letter-spacing: 0.16em; }
      .brand .overline .dot { width: 5px; height: 5px; border-width: 1px; }
      .mode-btn { padding: 8px 10px; font-size: 12px; }
      .mode-btn svg { width: 16px; height: 16px; }
      .mode-wrap { bottom: 16px; }
      .mode-label { font-size: 8px; }
    }
    @media (max-height: 520px) {
      .brand { padding: 10px 16px; }
      .brand .sub, .tricolor { display: none; }
      .mode-wrap { bottom: 10px; }
      .mode-label { display: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div class="hud">
    <header class="brand">
      <div class="overline"><span class="dot"></span>Paris &nbsp;·&nbsp; 7<sup>e</sup> arrondissement</div>
      <h1>La Tour Eiffel</h1>
      <p class="sub">a cel-shaded adventure at the Champ de Mars</p>
      <div class="tricolor" aria-hidden="true"><span></span><span></span><span></span></div>
    </header>

    <div class="mode-wrap">
      <div class="mode-label">Time of day</div>
      <div class="mode-switch" role="group" aria-label="Time of day">
        <button class="mode-btn" data-tod="day" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"></circle>
            <path d="M12 2.4v3M12 18.6v3M2.4 12h3M18.6 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"></path>
          </svg>
          <span>Day</span>
        </button>
        <button class="mode-btn" data-tod="dusk" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 17h18M6.5 17a5.5 5.5 0 0 1 11 0"></path>
            <path d="M12 4.2v2.6M4.9 7.4l1.9 1.9M19.1 7.4l-1.9 1.9M2.2 13h2.2M19.6 13h2.2"></path>
          </svg>
          <span>Dusk</span>
        </button>
        <button class="mode-btn" data-tod="night" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.4 14.6A8.6 8.6 0 0 1 9.4 3.6a8.9 8.9 0 1 0 11 11Z"></path>
            <path d="M16.4 3.2v2.6M15.1 4.5h2.6"></path>
          </svg>
          <span>Night</span>
        </button>
      </div>
    </div>

    <div class="bottom">
      <div class="hint"><b>Drag</b> to orbit<span class="sep">·</span><b>Scroll</b> to zoom<span class="sep">·</span><b>1 2 3</b> for light</div>
    </div>
  </div>

  <div id="veil">
    <div class="veil-inner">
      <div class="kicker">Paris, France</div>
      <h1>La Tour Eiffel</h1>
      <div class="loadline"></div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "../../../vendor/three/build/three.module.js",
      "three/addons/": "../../../vendor/three/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
