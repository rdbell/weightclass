<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scholar's Mate — Interactive Chess Lesson</title>
<style>
  :root {
    --bg: #191816;
    --panel: #242220;
    --panel2: #2d2a26;
    --chip: #3a3731;
    --chip-hover: #46423a;
    --line: #3d3a34;
    --text: #eae5d7;
    --dim: #a29c8c;
    --accent: #81b64c;
    --accent-ink: #17260c;
    --danger: #d94f43;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; height: 100dvh; }

  .stage { flex: 1; min-width: 0; display: grid; place-items: center; padding: 18px; }
  .board-frame { width: min(100%, calc(100dvh - 36px), 780px); aspect-ratio: 1; }
  #board { width: 100%; height: 100%; display: block; }

  .panel {
    width: min(400px, 38vw);
    background: var(--panel);
    border-left: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 14px;
    padding: 22px 22px 18px;
    overflow-y: auto;
  }
  .overline {
    font-size: 11px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--accent);
  }
  h1 { margin: 4px 0 4px; font-size: 26px; letter-spacing: -0.01em; }
  .sub { color: var(--dim); font-size: 14px; line-height: 1.4; }
  #verifiedNote { margin-top: 6px; color: #6f8f4e; font-size: 11px; line-height: 1.35; }

  .caption-card {
    background: var(--panel2);
    border-left: 4px solid var(--accent);
    border-radius: 10px;
    padding: 13px 16px 14px;
    min-height: 112px;
  }
  .cap-top { display: flex; align-items: center; gap: 10px; min-height: 26px; }
  .cap-move { font-family: var(--mono); font-weight: 700; font-size: 19px; color: var(--accent); }
  .badge {
    font-size: 10px; font-weight: 800; letter-spacing: 0.1em;
    background: var(--danger); color: #fff;
    padding: 3px 8px; border-radius: 20px;
  }
  .cap-text { margin: 7px 0 0; font-size: 15.5px; line-height: 1.5; }

  .panel-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--dim); margin-bottom: 8px;
  }
  .movelist {
    display: grid; grid-template-columns: auto 1fr 1fr;
    gap: 6px 8px; align-items: center;
  }
  .row-num { color: var(--dim); font-size: 13px; font-family: var(--mono); }
  .chip {
    font-family: var(--mono); font-size: 14px;
    padding: 7px 10px; border-radius: 8px;
    background: var(--chip); color: var(--dim);
    border: 0; cursor: pointer; text-align: left;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background .15s, color .15s;
  }
  .chip:hover { background: var(--chip-hover); }
  .chip.done { color: var(--text); }
  .chip.current { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

  .controls-wrap { margin-top: auto; }
  .progress {
    height: 5px; border-radius: 3px; background: var(--chip);
    overflow: hidden; margin-bottom: 12px;
  }
  #progressFill {
    height: 100%; width: 0;
    background: var(--accent); border-radius: 3px;
    transition: width .25s linear;
  }
  .controls { display: flex; gap: 10px; align-items: center; }
  .ctl {
    width: 46px; height: 46px; border-radius: 10px;
    background: var(--chip); color: var(--text);
    border: 1px solid var(--line);
    display: grid; place-items: center; cursor: pointer;
    transition: background .15s;
  }
  .ctl:hover { background: var(--chip-hover); }
  .ctl:disabled { opacity: .35; cursor: default; }
  .ctl:disabled:hover { background: var(--chip); }
  .ctl svg { width: 22px; height: 22px; fill: currentColor; }
  .ctl.primary { width: 58px; background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .ctl.primary:hover { background: #8fc75a; }
  .hint { margin-top: 10px; color: var(--dim); font-size: 12px; }

  @media (max-width: 880px) {
    body { overflow: auto; }
    .app { flex-direction: column; height: auto; min-height: 100dvh; }
    .stage { padding: 12px; }
    .board-frame { width: min(97vw, calc(100dvh - 300px)); min-width: 270px; }
    .panel {
      width: 100%; border-left: 0; border-top: 1px solid var(--line);
      padding: 14px 16px 16px; gap: 11px;
    }
    h1 { font-size: 21px; }
    .caption-card { min-height: 0; }
    .cap-text { font-size: 14.5px; }
    .chip { padding: 9px 10px; }
    .ctl { width: 44px; height: 44px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "../../../vendor/three/build/three.module.js",
    "three/addons/": "../../../vendor/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="app">
  <div class="stage">
    <div class="board-frame"><canvas id="board"></canvas></div>
  </div>
  <aside class="panel">
    <header>
      <div class="overline">Opening trap · Interactive lesson</div>
      <h1>Scholar&rsquo;s Mate</h1>
      <div class="sub">The four-move checkmate — and how to make sure it never works on you.</div>
      <div id="verifiedNote"></div>
    </header>

    <section class="caption-card">
      <div class="cap-top">
        <span class="cap-move" id="capMove"></span>
        <span class="badge" id="mateBadge" style="display:none">CHECKMATE</span>
      </div>
      <p class="cap-text" id="capText"></p>
    </section>

    <section>
      <div class="panel-label">Moves</div>
      <div class="movelist" id="moveList"></div>
    </section>

    <section class="controls-wrap">
      <div class="progress"><div id="progressFill"></div></div>
      <div class="controls">
        <button class="ctl" id="btnPrev" title="Previous move" aria-label="Previous move">
          <svg viewBox="0 0 24 24"><path d="M7 6h2.4v12H7zM18 6v12l-8.2-6z"/></svg>
        </button>
        <button class="ctl primary" id="btnPlay" title="Play or pause (Space)" aria-label="Play or pause"></button>
        <button class="ctl" id="btnNext" title="Next move" aria-label="Next move">
          <svg viewBox="0 0 24 24"><path d="M14.6 6H17v12h-2.4zM6 6v12l8.2-6z"/></svg>
        </button>
        <button class="ctl" id="btnReplay" title="Replay (R)" aria-label="Replay">
          <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6.2 12 10V7a5 5 0 1 1-4.9 6H5a7 7 0 1 0 7-8z"/></svg>
        </button>
      </div>
      <div class="hint">Space: play/pause &nbsp;·&nbsp; &larr; / &rarr;: step moves &nbsp;·&nbsp; R: replay &nbsp;·&nbsp; click a move to jump</div>
    </section>
  </aside>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
