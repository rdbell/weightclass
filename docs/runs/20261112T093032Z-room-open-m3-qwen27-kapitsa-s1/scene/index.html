<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Reading Room</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0d0a10; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  .ui {
    position: fixed; z-index: 10;
    font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    color: #e8d9bd; user-select: none; -webkit-user-select: none;
    text-shadow: 0 1px 8px rgba(0,0,0,0.8);
  }
  #title { top: 18px; left: 22px; pointer-events: none; }
  #title h1 { margin: 0; font-size: 21px; font-weight: 400; letter-spacing: 2.5px; }
  #title p { margin: 4px 0 0 1px; font-size: 12.5px; font-style: italic; color: #c9b694; letter-spacing: 0.5px; }
  #views { top: 18px; right: 22px; display: flex; gap: 8px; }
  #views button {
    font-family: inherit; font-size: 12.5px; letter-spacing: 1.2px;
    color: #e8d9bd; background: rgba(24, 17, 14, 0.55);
    border: 1px solid rgba(216, 180, 128, 0.4); border-radius: 999px;
    padding: 7px 16px 8px; cursor: pointer; backdrop-filter: blur(6px);
    transition: background 0.25s, border-color 0.25s, color 0.25s;
  }
  #views button:hover { background: rgba(58, 40, 28, 0.7); border-color: rgba(232, 200, 150, 0.7); }
  #views button.active { background: rgba(122, 82, 44, 0.65); border-color: rgba(240, 210, 160, 0.9); color: #fff3dd; }
  #hint {
    bottom: 16px; left: 50%; transform: translateX(-50%);
    font-size: 12px; font-style: italic; color: #b8a684; letter-spacing: 1px;
    pointer-events: none; transition: opacity 1.5s; opacity: 0.85;
  }
  #vignette {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 52%, rgba(8,4,10,0.55) 100%);
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "../../../vendor/three/build/three.module.js",
    "three/addons/": "../../../vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div class="ui" id="title">
  <h1>THE READING ROOM</h1>
  <p>an evening in &mdash; fire, lamplight &amp; low dusk</p>
</div>
<div class="ui" id="views">
  <button id="btn-door" class="active">Doorway</button>
  <button id="btn-top">Top view</button>
</div>
<div class="ui" id="hint">drag to orbit &middot; scroll to zoom &middot; right-drag to pan</div>
<div id="vignette"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
