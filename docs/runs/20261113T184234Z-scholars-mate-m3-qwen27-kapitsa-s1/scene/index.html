<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scholar&rsquo;s Mate &mdash; an interactive lesson</title>
<style>
  :root {
    --bg: #1b1916;
    --panel: #232019;
    --panel2: #26231d;
    --line: #353128;
    --text: #ede8dc;
    --text2: #a89f8e;
    --text3: #6f6858;
    --accent: #e8b84b;
    --accent-deep: #c99b3b;
    --green: #769656;
    --cream: #ebecd0;
    --red: #e85d4f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    background-image: radial-gradient(1200px 700px at 30% -10%, #242019 0%, rgba(27,25,22,0) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  #app { height: 100dvh; display: flex; flex-direction: column; }

  /* ------------------------------------------------ top bar */
  #topbar {
    display: flex; align-items: baseline; gap: 14px;
    padding: 13px 22px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(#23201a, #1e1b16);
    flex: none;
  }
  #topbar h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 21px; font-weight: 600; letter-spacing: 0.4px;
    color: var(--text);
    white-space: nowrap;
  }
  #topbar .sub { color: var(--text2); font-size: 13px; white-space: nowrap; }
  #topbar .spacer { flex: 1; }
  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; letter-spacing: 0.6px; text-transform: uppercase;
    color: var(--text2);
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 12px;
  }
  .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text3); transition: background .3s; }
  .badge.playing .dot { background: #8fd08a; box-shadow: 0 0 8px rgba(143, 208, 138, 0.7); }
  .badge.playing { color: #b9d8b2; }
  .badge.paused .dot { background: var(--accent); }
  .badge.finished .dot { background: #8fd08a; }
  .badge.finished { color: #b9d8b2; }

  /* ------------------------------------------------ layout */
  #main { flex: 1; display: flex; gap: 18px; padding: 18px 22px; min-height: 0; }
  #boardWrap {
    flex: 1; min-width: 0; min-height: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #boardBox {
    position: relative; line-height: 0; border-radius: 10px;
    box-shadow: 0 26px 70px rgba(0, 0, 0, 0.55), 0 4px 18px rgba(0, 0, 0, 0.4);
  }
  #board { width: 100%; height: 100%; display: block; border-radius: 10px; }
  #mateStamp {
    position: absolute;
    top: 31%; left: 50%;
    transform: translate(-50%, -50%) rotate(-9deg) scale(0.9);
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(17px, 3.6vmin, 38px);
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    white-space: nowrap;
    color: #f5e7c8;
    background: rgba(30, 24, 14, 0.8);
    border: 3px solid var(--accent);
    border-radius: 8px;
    padding: 0.3em 0.8em;
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.2, 1.4, 0.4, 1);
  }
  #mateStamp.show {
    opacity: 1;
    transform: translate(-50%, -50%) rotate(-9deg) scale(1);
  }

  #panel { width: 352px; flex: none; display: flex; flex-direction: column; gap: 14px; min-height: 0; }

  /* ------------------------------------------------ caption */
  #captionCard {
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
    min-height: 128px;
    flex: none;
  }
  #capTag {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 16px; font-weight: 700; letter-spacing: 0.3px;
    color: var(--accent);
    margin-bottom: 7px;
  }
  #capText { font-size: 14.5px; line-height: 1.55; color: #d9d2c3; }
  #captionCard.swap #capTag, #captionCard.swap #capText {
    animation: capIn 0.45s cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  @keyframes capIn { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

  /* ------------------------------------------------ move list */
  #movelist {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px;
    flex: none;
  }
  .ml-row { display: grid; grid-template-columns: 30px 1fr 1fr; gap: 6px; }
  .ml-row + .ml-row { margin-top: 4px; }
  .ml-row .num { color: var(--text3); font-size: 13px; padding-top: 9px; text-align: left; }
  .ml-cell {
    text-align: left;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    color: #cfc8b8;
    font-size: 14px; font-weight: 600;
    font-family: inherit;
    padding: 8px 10px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .ml-cell:hover { background: #2c2820; }
  .ml-cell:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .ml-cell.active { background: #3a3423; border-color: #5a4b2a; color: #f2e4bc; }
  .ml-cell .mate { color: var(--accent); }

  /* ------------------------------------------------ controls */
  #controls {
    margin-top: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px 12px;
    flex: none;
  }
  .btns { display: flex; gap: 10px; justify-content: center; align-items: center; }
  button.ctl {
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 1px solid #3a352b;
    background: #2a261f;
    color: #d8d2c4;
    display: grid; place-items: center;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s, opacity 0.2s;
  }
  button.ctl:hover { background: #332e25; }
  button.ctl:active { transform: scale(0.94); }
  button.ctl:disabled { opacity: 0.35; cursor: default; }
  button.ctl:disabled:hover { background: #2a261f; }
  button.ctl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #btnPlay {
    width: 58px; height: 58px;
    background: linear-gradient(#efc25c, var(--accent-deep));
    border-color: #8a6d2c;
    color: #241d10;
    box-shadow: 0 4px 16px rgba(232, 184, 75, 0.25);
  }
  #btnPlay:hover { background: linear-gradient(#f5ca68, #d3a544); }

  #progress { margin-top: 14px; }
  #phaseRow {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11.5px; color: var(--text2);
    letter-spacing: 0.5px; text-transform: uppercase;
    margin-bottom: 8px;
  }
  #phaseLabel { color: #cfc8b8; font-weight: 600; }
  #bar {
    position: relative; height: 8px;
    border-radius: 4px;
    background: #35312a;
    cursor: pointer;
    touch-action: none;
  }
  #barFill {
    position: absolute; top: 0; bottom: 0; left: 0; width: 0%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--accent-deep), var(--accent));
    pointer-events: none;
  }
  #bar .tick {
    position: absolute; top: 50%;
    width: 3px; height: 3px; border-radius: 50%;
    background: #15130f;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .hint { text-align: center; color: var(--text3); font-size: 11px; margin-top: 10px; letter-spacing: 0.3px; }

  /* ------------------------------------------------ mobile */
  @media (max-width: 820px) {
    body { overflow-y: auto; }
    #app { height: auto; min-height: 100dvh; }
    #topbar { padding: 11px 14px; gap: 10px; }
    #topbar h1 { font-size: 18px; }
    #topbar .sub { display: none; }
    #main { flex-direction: column; padding: 12px; gap: 12px; }
    #boardWrap { flex: none; }
    #panel { width: auto; }
    #captionCard { min-height: 0; }
    #controls { margin-top: 0; }
    .hint { display: none; }
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "../../../vendor/three/build/three.module.js",
    "three/addons/": "../../../vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <h1>Scholar&rsquo;s Mate</h1>
    <span class="sub">The classic four-move trap &middot; shown from Black&rsquo;s perspective</span>
    <span class="spacer"></span>
    <span class="badge" id="badge"><span class="dot"></span><span id="badgeText">Loading</span></span>
  </header>

  <main id="main">
    <section id="boardWrap">
      <div id="boardBox">
        <canvas id="board"></canvas>
        <div id="mateStamp" aria-hidden="true">Checkmate</div>
      </div>
    </section>

    <aside id="panel">
      <div id="captionCard">
        <div id="capTag">Scholar&rsquo;s Mate</div>
        <div id="capText">A four-move trap aimed at f7 &mdash; the weakest square in Black&rsquo;s camp.</div>
      </div>

      <div id="movelist" aria-label="Move list"></div>

      <div id="controls">
        <div class="btns">
          <button class="ctl" id="btnReplay" title="Replay (R)" aria-label="Replay">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 6V3L8 7l4 4V8c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" fill="currentColor"/></svg>
          </button>
          <button class="ctl" id="btnPrev" title="Previous move (&larr;)" aria-label="Previous move">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M7 6h2.4v12H7zM18 6l-7.2 6L18 18z" fill="currentColor"/></svg>
          </button>
          <button class="ctl" id="btnPlay" title="Play / pause (Space)" aria-label="Play or pause">
            <svg id="iconPlay" viewBox="0 0 24 24" width="26" height="26"><path d="M8.5 5v14l11-7z" fill="currentColor"/></svg>
            <svg id="iconPause" viewBox="0 0 24 24" width="26" height="26" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
          </button>
          <button class="ctl" id="btnNext" title="Next move (&rarr;)" aria-label="Next move">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M14.6 6H17v12h-2.4zM6 6l7.2 6L6 18z" fill="currentColor"/></svg>
          </button>
        </div>
        <div id="progress">
          <div id="phaseRow"><span id="phaseLabel">Start</span><span id="stepCount">Step 1 of 11</span></div>
          <div id="bar" aria-label="Lesson progress"><div id="barFill"></div></div>
        </div>
        <div class="hint">Space play/pause &middot; &larr; &rarr; step &middot; R replay</div>
      </div>
    </aside>
  </main>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
