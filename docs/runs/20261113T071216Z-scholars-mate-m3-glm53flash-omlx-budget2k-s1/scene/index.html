<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Scholar's Mate — Chess Lesson</title>
<style>
  :root{
    --bg:#171b22;
    --panel:#222834;
    --panel2:#2b3242;
    --line:#3a4356;
    --text:#e8ebf2;
    --muted:#9aa3b5;
    --accent:#f2b64c;
    --accent2:#7fae5f;
    --danger:#e06c5f;
    --board-light:#e9dcc0;
    --board-dark:#6e9159;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:radial-gradient(1200px 700px at 50% -10%, #232a36 0%, #171b22 60%, #12151b 100%);
    color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
  }
  #app{position:fixed; inset:0; display:flex;}

  /* ---------- Stage (three.js canvas fills this) ---------- */
  #stage{position:absolute; inset:0;}
  #stage canvas{display:block; width:100%; height:100%;}

  /* ---------- Top bar ---------- */
  header{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; gap:14px;
    padding:10px 18px;
    background:linear-gradient(180deg, rgba(16,19,25,.92), rgba(16,19,25,.55) 75%, transparent);
    z-index:5; pointer-events:none;
  }
  .kicker{
    display:flex; flex-direction:column; line-height:1.25; pointer-events:auto;
  }
  .kicker b{font-size:15px; letter-spacing:.4px;}
  .kicker span{font-size:11.5px; color:var(--muted); letter-spacing:1.2px; text-transform:uppercase;}
  .badge{
    margin-left:auto; pointer-events:auto;
    font-size:11px; letter-spacing:1.4px; text-transform:uppercase;
    color:var(--accent); border:1px solid rgba(242,182,76,.45);
    background:rgba(242,182,76,.08);
    border-radius:999px; padding:6px 12px; white-space:nowrap;
  }

  /* ---------- Move list ---------- */
  #movelist{
    position:absolute; top:64px; left:14px; z-index:6;
    width:262px;
    background:rgba(26,31,40,.94);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    overflow:hidden;
    backdrop-filter:blur(6px);
  }
  #movelist .ml-head{
    font-size:10.5px; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--muted); padding:9px 12px 7px;
    border-bottom:1px solid var(--line);
  }
  .ml-rows{display:flex; flex-direction:column;}
  .ml-row{display:flex; width:100%; border:0; background:transparent; color:var(--text);
    font:inherit; font-size:13.5px; align-items:center; gap:0; cursor:pointer;
    padding:0; text-align:left;}
  .ml-row:hover{background:rgba(255,255,255,.045);}
  .ml-num{width:34px; padding:8px 0 8px 12px; color:var(--muted); font-size:12px; flex:none;}
  .ml-mv{flex:1; padding:8px 10px 8px 4px; white-space:nowrap;}
  .ml-mv .san{font-weight:600;}
  .ml-mv .tag{margin-left:6px; font-size:10.5px; letter-spacing:.6px; text-transform:uppercase; color:var(--muted);}
  .ml-mv .tag.cap{color:var(--danger);}
  .ml-mv .tag.mate{color:var(--accent);}
  .ml-row .cur{width:4px; align-self:stretch; background:transparent; flex:none;}
  .ml-row.active{background:rgba(242,182,76,.10);}
  .ml-row.active .cur{background:var(--accent);}
  .ml-row.done .san{color:#cfd5e2;}
  .ml-row.active .san{color:var(--accent);}
  .ml-row.active .tag.mate{color:#ffd88a;}
  .ml-note{padding:7px 12px 9px; font-size:10.5px; color:var(--muted); border-top:1px solid var(--line); line-height:1.45;}

  /* ---------- Caption ---------- */
  #caption{
    position:absolute; left:50%; transform:translateX(-50%);
    bottom:158px; z-index:6;
    max-width:min(680px, calc(100vw - 32px));
    background:rgba(24,29,38,.94);
    border:1px solid var(--line);
    border-left:4px solid var(--accent);
    border-radius:12px;
    padding:12px 18px;
    font-size:16.5px; line-height:1.5;
    box-shadow:0 14px 34px rgba(0,0,0,.5);
    backdrop-filter:blur(6px);
    transition:opacity .28s ease, transform .28s ease;
    text-align:center;
  }
  /* wide screens: caption lives in the left column under the move list */
  @media (min-width: 981px){
    #caption{
      left:14px; bottom:auto; top:388px;
      transform:none; width:262px; max-width:none;
      text-align:left; font-size:13.5px; line-height:1.55; padding:13px 15px;
    }
    #caption.hide{transform:translateY(8px);}
  }
  #caption .cap-title{
    display:block; font-size:11px; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--accent); margin-bottom:3px;
  }
  #caption.warn{border-left-color:var(--danger);}
  #caption.warn .cap-title{color:var(--danger);}
  #caption.good{border-left-color:var(--accent2);}
  #caption.good .cap-title{color:var(--accent2);}
  #caption.hide{opacity:0; transform:translateX(-50%) translateY(8px); pointer-events:none;}

  /* ---------- Controls ---------- */
  #controls{
    position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
    z-index:6; width:min(680px, calc(100vw - 28px));
    display:flex; flex-direction:column; gap:10px;
  }
  #progress{
    position:relative; height:22px; display:flex; align-items:center; cursor:pointer; touch-action:none;
  }
  #progress .track{
    position:absolute; left:0; right:0; top:50%; height:7px; transform:translateY(-50%);
    background:#141821; border:1px solid var(--line); border-radius:99px; overflow:hidden;
  }
  #progress .fill{
    height:100%; width:0%;
    background:linear-gradient(90deg, rgba(242,182,76,.55), var(--accent));
    border-radius:99px;
  }
  #progress .knob{
    position:absolute; top:50%; left:0; width:15px; height:15px;
    transform:translate(-50%,-50%);
    background:var(--accent); border:2px solid #141821; border-radius:50%;
    box-shadow:0 1px 6px rgba(0,0,0,.6);
  }
  #progress .pt{position:absolute; top:50%; width:5px; height:5px; transform:translate(-50%,-50%); background:#4a5468; border-radius:50%;}
  #progress .pt.past{background:var(--accent2);}

  .btnrow{display:flex; align-items:center; justify-content:center; gap:10px;}
  button.ctl{
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:12px;
    padding:11px 16px; font:inherit; font-size:13.5px; font-weight:600; letter-spacing:.3px;
    cursor:pointer; transition:background .15s ease, transform .1s ease, border-color .15s ease;
    box-shadow:0 3px 10px rgba(0,0,0,.35);
    min-width:46px;
  }
  button.ctl:hover{background:#363f52; border-color:#4a556c;}
  button.ctl:active{transform:translateY(1px);}
  button.ctl svg{display:block;}
  button.ctl:disabled{opacity:.4; cursor:default;}
  button.ctl:disabled:hover{background:var(--panel2); border-color:var(--line);}
  button.ctl.primary{
    background:linear-gradient(180deg, #f4c268, #e8a83c);
    border-color:#c98f2a; color:#241a06;
    padding:11px 22px;
  }
  button.ctl.primary:hover{background:linear-gradient(180deg, #ffd07a, #f2b34c);}

  /* ---------- Layout responsiveness ---------- */
  @media (max-width: 900px){
    #movelist{left:10px; top:56px; width:200px;}
    #caption{bottom:150px; font-size:14.5px; padding:10px 14px;}
  }
  @media (max-width: 760px){
    header{padding:8px 12px;}
    .kicker b{font-size:13.5px;}
    .kicker span{font-size:10px;}
    .badge{display:none;}
    #movelist{top:50px; width:172px;}
    .ml-num{width:26px; padding-left:9px; font-size:11px;}
    .ml-mv{font-size:12.5px; padding-right:8px;}
    .ml-mv .tag{font-size:9px; margin-left:4px;}
    .ml-note{display:none;}
    #caption{bottom:142px; font-size:13.5px; max-width:calc(100vw - 20px);}
    #controls{width:calc(100vw - 16px); bottom:10px; gap:7px;}
    button.ctl{padding:10px 12px; font-size:12px; border-radius:10px;}
    button.ctl.primary{padding:10px 18px;}
    button.ctl .lbl{display:none;}
    .btnrow{gap:8px;}
  }
  @media (max-width: 420px){
    #caption{bottom:136px; font-size:12.5px;}
  }
</style>

<body>
<div id="app">
  <div id="stage"></div>

  <header>
    <div class="kicker">
      <b>Scholar&rsquo;s Mate</b>
      <span>Interactive Lesson &middot; Black&rsquo;s Perspective</span>
    </div>
    <div class="badge">Trap &middot; 4 Moves &middot; Avoidable</div>
  </header>

  <div id="movelist">
    <div class="ml-head">Move list</div>
    <div class="ml-rows" id="mlrows"></div>
    <div class="ml-note">Tap any move to jump there. The lesson runs from Black&rsquo;s side &mdash; your pieces are below.</div>
  </div>

  <div id="caption"><span class="cap-title" id="capTitle"></span><span id="capText"></span></div>

  <div id="controls">
    <div id="progress" title="Drag to scrub through the lesson">
      <div class="track"><div class="fill" id="progFill"></div></div>
      <div class="knob" id="progKnob"></div>
    </div>
    <div class="btnrow">
      <button class="ctl" id="btnPrev" title="Previous move">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M19 5v14L8.5 12 19 5zM6 5h2.6v14H6z"/></svg>
      </button>
      <button class="ctl primary" id="btnPlay" title="Play / pause">
        <svg id="icPlay" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5L7 4.5z"/></svg>
        <svg id="icPause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 4h4.4v16H6zM13.6 4H18v16h-4.4z"/></svg>
        <span class="lbl" id="playLbl">Play</span>
      </button>
      <button class="ctl" id="btnReplay" title="Replay from the start">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1.6L6.8 6.8 12 12V7c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H3.4c0 4.7 3.9 8.6 8.6 8.6s8.6-3.9 8.6-8.6S16.7 5 12 5z"/></svg>
        <span class="lbl">Replay</span>
      </button>
      <button class="ctl" id="btnNext" title="Next move">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M5 5l10.5 7L5 19V5zm10.4 0H18v14h-2.6z"/></svg>
      </button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   RNG (seeded, deterministic)
============================================================ */
let _s = 0x9E3779B9;
function srand(seed){ _s = seed >>> 0; }
function rnd(){ // mulberry32
  _s = (_s + 0x6D2B79F5) >>> 0;
  let t = _s;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

/* ============================================================
   Coordinates — Black's perspective.
   View col 0..7  = files h..a  (left -> right)
   View row 0..7  = ranks 1..8  (top  -> bottom)
   So rank 8 (Black's back rank) is at the bottom of the screen.
============================================================ */
const FILES = ['a','b','c','d','e','f','g','h'];
function sqToFileRank(sq){ return { f: FILES.indexOf(sq[0]), r: parseInt(sq[1], 10) }; }
function sqToView(sq){ // -> {col,row} in board units (0..7)
  const { f, r } = sqToFileRank(sq);
  return { col: 7 - f, row: r - 1 };
}
function viewToSq(col, row){ return FILES[7 - col] + (row + 1); }
// board-units -> world units (board spans -3.5..3.5), +y up on screen
function colToWorldX(col){ return col - 3.5; }
function rowToWorldY(row){ return 3.5 - row; }

/* ============================================================
   The supplied, verified line:
   1. e4 e5  2. Bc4 Nc6  3. Qh5 Nf6  4. Qxf7#
============================================================ */
const PIECE_NAMES = { P:'pawn', N:'knight', B:'bishop', R:'rook', Q:'queen', K:'king' };
const MOVES = [
  { san:'e4',    from:'e2', to:'e4', piece:'P', color:'w' },
  { san:'e5',    from:'e7', to:'e5', piece:'P', color:'b' },
  { san:'Bc4',   from:'f1', to:'c4', piece:'B', color:'w' },
  { san:'Nc6',   from:'b8', to:'c6', piece:'N', color:'b' },
  { san:'Qh5',   from:'d1', to:'h5', piece:'Q', color:'w' },
  { san:'Nf6',   from:'g8', to:'f6', piece:'N', color:'b' },
  { san:'Qxf7#', from:'h5', to:'f7', piece:'Q', color:'w', capture:'P' },
];

/* Initial standard chess position */
function initialBoard(){
  const b = {};
  const back = ['R','N','B','Q','K','B','N','R'];
  for (let i = 0; i < 8; i++){
    b[FILES[i] + '1'] = { piece: back[i], color: 'w' };
    b[FILES[i] + '2'] = { piece: 'P', color: 'w' };
    b[FILES[i] + '7'] = { piece: 'P', color: 'b' };
    b[FILES[i] + '8'] = { piece: back[i], color: 'b' };
  }
  return b;
}
/* Board state after k half-moves (0..7); replays exactly, restoring captures */
function boardAfter(k){
  const b = initialBoard();
  for (let i = 0; i < k; i++){
    const m = MOVES[i];
    if (m.capture) delete b[m.to];
    b[m.to] = { piece: m.piece, color: m.color };
    delete b[m.from];
  }
  return b;
}

/* ============================================================
   Scene setup — orthographic, straight-down 2D view
============================================================ */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171b22);

const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -10, 10);
camera.position.set(0, 0, 5);
camera.lookAt(0, 0, 0);

const SQ = 1;                 // world size of one square
const MARGIN = 0.52;          // coordinate-label margin around the board
const BOARD_W = 8 * SQ;
const HALF = BOARD_W / 2;

function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h);
  // Reserve room for header, caption and controls; center the board there.
  const padTop = Math.min(90, h * 0.14);
  const padBottom = h < 620 ? 120 : 165;          // controls
  const wide = w > 980;
  const padL = wide ? 295 : 24;                   // room for the move list on wide screens
  const padR = 24;
  const span = BOARD_W + 2 * MARGIN;
  const availW = Math.max(160, w - padL - padR);
  const availH = Math.max(160, h - padTop - padBottom);
  const fitScale = Math.min(availW / span, availH / span);
  const vw = w / fitScale, vh = h / fitScale;
  // world-space center of the usable band
  const centerX = (padL + (w - padR)) / 2;
  const centerY = (padTop + (h - padBottom)) / 2;
  const offX = (w / 2 - centerX) / fitScale;
  const offY = (centerY - h / 2) / fitScale;
  camera.left = offX - vw / 2; camera.right = offX + vw / 2;
  camera.top = offY + vh / 2;  camera.bottom = offY - vh / 2;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

/* ============================================================
   Canvas texture helpers
============================================================ */
function makeCanvas(w, h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function canvasTex(canvas){
  const t = new THREE.CanvasTexture(canvas);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.generateMipmaps = true;
  return t;
}

/* ---------------- Board texture (squares + coordinate labels) ------------- */
function buildBoardTexture(){
  const PX = 96;                       // per-square pixels
  const M = Math.round(MARGIN / SQ * PX); // margin in px
  const c = makeCanvas(8 * PX + 2 * M, 8 * PX + 2 * M);
  const g = c.getContext('2d');

  // outer margin
  g.fillStyle = '#1d222c';
  g.fillRect(0, 0, c.width, c.height);
  // subtle board frame
  g.fillStyle = '#141922';
  g.fillRect(M - 10, M - 10, 8 * PX + 20, 8 * PX + 20);
  g.fillStyle = '#0f131a';
  g.fillRect(M - 6, M - 6, 8 * PX + 12, 8 * PX + 12);

  const LIGHT = '#eadfc4', DARK = '#6e9159';
  for (let row = 0; row < 8; row++){
    for (let col = 0; col < 8; col++){
      // screen col 0 = file h ; screen row 0 = rank 1.
      // A1 (f=0,r=0) is at view col 7, row 0 = top-right and must be a DARK square.
      const isDark = (row + col) % 2 === 0;
      g.fillStyle = isDark ? DARK : LIGHT;
      g.fillRect(M + col * PX, M + row * PX, PX, PX);
      // soft inner shading for depth (still flat / top-down)
      if (isDark){
        g.fillStyle = 'rgba(0,0,0,0.06)';
        g.fillRect(M + col * PX, M + row * PX, PX, PX);
      }
    }
  }

  // coordinate labels — rotated board: files h..a left->right, ranks 1..8 top->bottom
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = `600 ${Math.round(PX * 0.185)}px 'Segoe UI', system-ui, sans-serif`;
  // files along the bottom AND top
  for (let col = 0; col < 8; col++){
    const file = FILES[7 - col];
    const x = M + col * PX + PX / 2;
    g.fillStyle = '#6a7488';
    g.fillText(file, x, M + 8 * PX + M / 2);
  }
  // ranks along the left AND right
  for (let row = 0; row < 8; row++){
    const rank = row + 1;
    const y = M + row * PX + PX / 2;
    g.fillStyle = '#6a7488';
    g.fillText(String(rank), M / 2, y);
  }

  // faint inner border
  g.strokeStyle = 'rgba(255,255,255,0.05)';
  g.lineWidth = 2;
  g.strokeRect(M, M, 8 * PX, 8 * PX);

  return canvasTex(c);
}

/* ---------------- Piece artwork ---------------------------------------------
   Hand-drawn vector pieces on canvas. White = cream fill + dark outline,
   Black = charcoal fill + light inner detail. Flat, crisp, readable.
---------------------------------------------------------------------------- */
const PIECE_CANVAS = {};
function buildPieceCanvases(){
  const S = 512;
  const defs = {};
  for (const color of ['w', 'b']){
    for (const code of ['K','Q','R','B','N','P']){
      const c = makeCanvas(S, S);
      const g = c.getContext('2d');
      g.translate(S/2, S/2);
      drawPiece(g, code, color, S);
      PIECE_CANVAS[color + code] = c;
    }
  }
}

function drawPiece(g, code, color, S){
  const u = S / 100;                       // design units
  const fill   = color === 'w' ? '#f3ead6' : '#2b2f38';
  const fill2  = color === 'w' ? '#e2d5b8' : '#1f232b';
  const stroke = color === 'w' ? '#3a3325' : '#c8cede';
  const detail = color === 'w' ? 'rgba(58,51,37,0.85)' : 'rgba(200,206,222,0.9)';
  g.lineWidth = 3.2 * u;
  g.strokeStyle = stroke;
  g.lineJoin = 'round';
  g.lineCap = 'round';

  const P = (path, close = true) => {
    g.beginPath();
    path.forEach((pt, i) => i === 0 ? g.moveTo(pt[0] * u, pt[1] * u) : g.lineTo(pt[0] * u, pt[1] * u));
    if (close) g.closePath();
  };
  const fillStroke = (pathFn) => {
    g.fillStyle = fill;
    pathFn();
    g.fill(); g.stroke();
  };
  const circle = (x, y, r, fillC, strokeIt = true) => {
    g.beginPath(); g.arc(x * u, y * u, r * u, 0, Math.PI * 2);
    g.fillStyle = fillC; g.fill();
    if (strokeIt){ g.strokeStyle = stroke; g.lineWidth = 3.2 * u; g.stroke(); }
  };

  if (code === 'P'){
    fillStroke(() => P([[-14,36],[14,36],[11,24],[8,-2],[16,-14],[0,-34],[-16,-14],[-8,-2],[-11,24]]));
    circle(0, -22, 11.5, fill);
    g.fillStyle = fill2; g.globalAlpha = .55;
    P([[-9,33],[9,33],[7.4,27],[-7.4,27]]); g.fill(); g.globalAlpha = 1;
  }
  else if (code === 'R'){
    fillStroke(() => {
      g.beginPath();
      const pts = [[-22,38],[22,38],[19,26],[19,-8],[24,-8],[24,-26],[12,-26],[12,-18],[5,-18],[5,-26],[-5,-26],[-5,-18],[-12,-18],[-12,-26],[-24,-26],[-24,-8],[19,-8]];
      pts.forEach((pt,i)=> i===0 ? g.moveTo(pt[0]*u, pt[1]*u) : g.lineTo(pt[0]*u, pt[1]*u));
      g.closePath();
    });
    // crenellation inner line + base detail
    g.strokeStyle = detail; g.lineWidth = 2.4 * u;
    P([[-14,24],[14,24]], false); g.stroke();
    P([[-14,32],[14,32]], false); g.stroke();
  }
  else if (code === 'B'){
    fillStroke(() => P([[-13,38],[13,38],[10,26],[7,16],[15,4],[8,-8],[14,-20],[0,-36],[-14,-20],[-8,-8],[-15,4],[-7,16],[-10,26]]));
    circle(0, -14, 4.6, detail, false);
    g.strokeStyle = detail; g.lineWidth = 2.6 * u;
    g.beginPath(); g.moveTo(0, -4*u); g.lineTo(0, 14*u); g.stroke();     // mitre slit
    P([[-8,30],[8,30]], false); g.stroke();                              // collar
  }
  else if (code === 'N'){
    // horse head facing left, with chest and base
    fillStroke(() => {

      pts.forEach((pt,i)=> i===0 ? g.moveTo(pt[0]*u, pt[1]*u) : g.lineTo(pt[0]*u, pt[1]*u));

      pts.forEach((pt,i)=> i===0 ? g.moveTo(pt[0]*u, pt[1]*u) : g.lineTo(pt[0]*u, pt[1]*u));

    [[24,-18],[8,-26],[0,-40],[-8,-26],[-24,-18]].forEach(p => circle(p[0], p[1], 3.6, fill));

    g.strokeStyle = detail; g.lineWidth = 2.6 * u;

    // body

/* ============================================================
   Scene objects
============================================================ */
let boardMesh, piecesGroup, overlay;
const pieceMeshes = new Map();   // square -> mesh
const boardY = 0, pieceZ = 0.1, overlayZ = 0.5;

function buildScene(){
  // Board
  const boardTex = buildBoardTexture();
  const bg = new THREE.Mesh(
    new THREE.PlaneGeometry(2 * HALF + 2 * MARGIN, 2 * HALF + 2 * MARGIN),
    new THREE.MeshBasicMaterial({ map: boardTex, transparent: false })
  );
  bg.position.z = -0.2;
  scene.add(bg);

  // Pieces
  buildPieceCanvases();
  piecesGroup = new THREE.Group();
  scene.add(piecesGroup);

  // Overlay canvas for highlights + arrows
  const oc = makeCanvas(2048, 2048);
  overlay = {
    canvas: oc,
    ctx: oc.getContext('2d'),
    tex: canvasTex(oc),
    mesh: new THREE.Mesh(
      new THREE.PlaneGeometry(2 * HALF, 2 * HALF),
      new THREE.MeshBasicMaterial({ map: null, transparent: true, depthWrite: false })
    ),
  };
  overlay.mesh.position.z = overlayZ;
  overlay.tex.image = oc;
  overlay.mesh.material.map = overlay.tex;
  scene.add(overlay.mesh);
}

const OVERLAY_PX = 256; // per square
function ovOrigin(){ return { x: 0, y: OVERLAY_PX * 8 }; } // top-left of canvas = top of board (rank 8 side... actually view row 0)
function sqToOvPx(col, row){
  return { x: col * OVERLAY_PX, y: row * OVERLAY_PX };
}
function centerOf(col, row){
  return { x: col * OVERLAY_PX + OVERLAY_PX / 2, y: row * OVERLAY_PX + OVERLAY_PX / 2 };
}

/* ---------- Highlight rendering ---------- */
function clearOverlay(){
  const g = overlay.ctx;
  g.clearRect(0, 0, overlay.canvas.width, overlay.canvas.height);
  overlay.tex.needsUpdate = true;
}

const HL = {
  threat:  { rgb: '224,108,95',  label: 'threat' },   // danger red
  attack:  { rgb: '242,182,76',  label: 'attack' },   // amber
  target:  { rgb: '242,182,76',  label: 'target' },
  last:    { rgb: '160,205,120', label: 'last' },     // soft green last-move
  capture: { rgb: '224,108,95',  label: 'capture' },
  info:    { rgb: '125,160,235', label: 'info' },     // blue informational
};

function drawHighlights(list){
  const g = overlay.ctx;
  g.clearRect(0, 0, overlay.canvas.width, overlay.canvas.height);
  for (const h of (list || [])){
    const v = sqToView(h.sq);
    const p = sqToOvPx(v.col, v.row);
    const { r, g: rg, b } = hexToRgb(h.color || '#f2b64c');
    g.save();
    if (h.style === 'corner'){
      // chess.com-style triangle corners
      g.fillStyle = `rgba(${r},${rg},${b},0.85)`;
      const L = OVERLAY_PX * 0.28;
      const x0 = p.x, y0 = p.y, x1 = p.x + OVERLAY_PX, y1 = p.y + OVERLAY_PX;
      g.beginPath(); g.moveTo(x0, y0); g.lineTo(x0 + L, y0); g.lineTo(x0, y0 + L); g.fill();
      g.beginPath(); g.moveTo(x1, y0); g.lineTo(x1 - L, y0); g.lineTo(x1, y0 + L); g.fill();
      g.beginPath(); g.moveTo(x0, y1); g.lineTo(x0 + L, y1); g.lineTo(x0, y1 - L); g.fill();
      g.beginPath(); g.moveTo(x1, y1); g.lineTo(x1 - L, y1); g.lineTo(x1, y1 - L); g.fill();
    } else if (h.style === 'ring'){
      g.strokeStyle = `rgba(${r},${rg},${b},0.95)`;
      g.lineWidth = OVERLAY_PX * 0.075;
      g.beginPath();
      g.arc(p.x + OVERLAY_PX/2, p.y + OVERLAY_PX/2, OVERLAY_PX * 0.42, 0, Math.PI * 2);
      g.stroke();
    } else {
      // full translucent square
      g.fillStyle = `rgba(${r},${rg},${b},0.32)`;
      g.fillRect(p.x, p.y, OVERLAY_PX, OVERLAY_PX);
      g.strokeStyle = `rgba(${r},${rg},${b},0.8)`;
      g.lineWidth = OVERLAY_PX * 0.035;
      g.strokeRect(p.x + 2, p.y + 2, OVERLAY_PX - 4, OVERLAY_PX - 4);
    }
    g.restore();
  }
  overlay.tex.needsUpdate = true;
}
function hexToRgb(hex){
  const n = parseInt(hex.slice(1), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

/* ---------- Arrow rendering ---------- */
function drawArrow(from, to, color, width = 0.16){
  const a = sqToView(from), b = sqToView(to);
  const pa = centerOf(a.col, a.row), pb = centerOf(b.col, b.row);
  const g = overlay.ctx;
  const { r, gg, bl } = hexToRgbStr(color);
  const dx = pb.x - pa.x, dy = pb.y - pa.y;
  const len = Math.hypot(dx, dy);
  const ux = dx / len, uy = dy / len;
  const startPad = OVERLAY_PX * 0.30;   // leave room so it doesn't cover the piece
  const headLen = OVERLAY_PX * 0.42;
  const shaftEnd = len - startPad - headLen * 0.55;
  const w = OVERLAY_PX * width;

  g.save();
  g.lineCap = 'round';
  // shaft
  g.strokeStyle = `rgba(${r},${gg},${bl},0.85)`;
  g.fillStyle = `rgba(${r},${gg},${bl},0.85)`;
  g.lineWidth = w;
  g.beginPath();
  g.moveTo(pa.x + ux * startPad, pa.y + uy * startPad);
  g.lineTo(pa.x + ux * shaftEnd, pa.y + uy * shaftEnd);
  g.stroke();
  // head
  const hx = pa.x + ux * (len - startPad * 0.6);
  const hy = pa.y + uy * (len - startPad * 0.6);
  const px = -uy, py = ux; // perpendicular
  g.beginPath();
  g.moveTo(hx, hy);
  g.lineTo(hx - ux * headLen + px * headLen * 0.5, hy - uy * headLen + py * headLen * 0.5);
  g.lineTo(hx - ux * headLen - px * headLen * 0.5, hy - uy * headLen - py * headLen * 0.5);
  g.closePath();
  g.fill();
  g.restore();
  overlay.tex.needsUpdate = true;
}
function hexToRgbStr(hex){
  const { r, g, b } = hexToRgb(hex);
  return { r, gg: g, bl: b };
}
function clearArrows(){ /* overlay cleared by drawHighlights */ }

/* ---------- Pieces ---------- */
const PIECE_Z = { P: 0.10, N: 0.11, B: 0.11, R: 0.11, Q: 0.12, K: 0.12 };
function spawnPieces(board){
  for (const [, m] of pieceMeshes) piecesGroup.remove(m);
  pieceMeshes.clear();
  for (const sq in board){
    const pc = board[sq];
    const mesh = makePieceMesh(pc);
    const v = sqToView(sq);
    mesh.position.set(colToWorldX(v.col), rowToWorldY(v.row), PIECE_Z[pc.piece]);
    mesh.userData.sq = sq;
    pieceMeshes.set(sq, mesh);
    piecesGroup.add(mesh);
  }
}
function makePieceMesh(pc){
  const size = SQ * (pc.piece === 'P' ? 0.92 : 1.0);
  const tex = canvasTex(PIECE_CANVAS[pc.color + pc.piece]);
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(size, size),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false })
  );
  mesh.userData = { pc, tex };
  return mesh;
}
function movePieceMesh(from, to){
  const mesh = pieceMeshes.get(from);
  if (!mesh) return null;
  pieceMeshes.delete(from);
  // captured piece is removed by caller
  pieceMeshes.set(to, mesh);
  mesh.userData.sq = to;
  return mesh;
}
function removePieceMesh(sq){
  const mesh = pieceMeshes.get(sq);
  if (!mesh) return null;
  pieceMeshes.delete(sq);
  piecesGroup.remove(mesh);
  return mesh;
}

/* Eased movement animation. Returns a promise-like via update loop. */
const anims = [];
function animateMove(mesh, from, to, dur, arc = 0){
  const a = sqToView(from), b = sqToView(to);
  const x0 = colToWorldX(a.col), y0 = rowToWorldY(a.row);
  const x1 = colToWorldX(b.col), y1 = rowToWorldY(b.row);
  anims.push({ mesh, x0, y0, x1, y1, dur, t: 0, arc });
}
function easeInOut(t){ return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

/* ============================================================
   Playback engine
============================================================ */
const state = {
  step: -1,          // index into STEPS, -1 = not started
  playing: false,
  moveIdx: 0,        // half-moves applied (0..7)
  stepElapsed: 0,
  holdTimer: 0,      // extra hold after move animation finishes
  animDone: false,
};

const els = {
  cap: document.getElementById('caption'),
  capTitle: document.getElementById('capTitle'),
  capText: document.getElementById('capText'),
  fill: document.getElementById('progFill'),
  knob: document.getElementById('progKnob'),
  progress: document.getElementById('progress'),
  btnPlay: document.getElementById('btnPlay'),
  btnPrev: document.getElementById('btnPrev'),
  btnNext: document.getElementById('btnNext'),
  btnReplay: document.getElementById('btnReplay'),
  icPlay: document.getElementById('icPlay'),
  icPause: document.getElementById('icPause'),
  playLbl: document.getElementById('playLbl'),
  mlrows: document.getElementById('mlrows'),
};

/* move list UI: one row per half-move, grouped by full move number */
function buildMoveList(){
  els.mlrows.innerHTML = '';
  for (let i = 0; i < MOVES.length; i++){
    const m = MOVES[i];
    const row = document.createElement('button');
    row.className = 'ml-row';
    row.dataset.moveIdx = String(i + 1);
    const num = document.createElement('span');
    num.className = 'ml-num';
    num.textContent = m.color === 'w' ? `${i / 2 + 1}.` : '';
    const mv = document.createElement('span');
    mv.className = 'ml-mv';
    const san = document.createElement('span');
    san.className = 'san';
    san.textContent = m.san.replace('#', '#');
    mv.appendChild(san);
    const tag = document.createElement('span');
    tag.className = 'tag';
    if (m.capture){ tag.textContent = 'captures'; tag.classList.add('cap'); }
    else if (m.san.includes('#')){ tag.textContent = 'mate'; tag.classList.add('mate'); }
    mv.appendChild(tag);
    const cur = document.createElement('span');
    cur.className = 'cur';
    row.append(num, mv, cur);
    row.addEventListener('click', () => { gotoMove(i + 1); play(); });
    els.mlrows.appendChild(row);
  }
}
function refreshMoveList(){
  const rows = els.mlrows.querySelectorAll('.ml-row');
  rows.forEach((r, i) => {
    const done = i < state.moveIdx;
    const active = i === state.moveIdx - 1;
    r.classList.toggle('done', done && !active);
    r.classList.toggle('active', active);
  });
  // keep active row visible
  const act = els.mlrows.querySelector('.ml-row.active');
  if (act) act.scrollIntoView({ block: 'nearest' });
}

/* progress: 0..STEPS.length */
function refreshProgress(){
  const t = Math.min(1, (state.step + 1) / STEPS.length);
  const shown = state.step < 0 ? 0 : t;
  els.fill.style.width = (shown * 100).toFixed(2) + '%';
  els.knob.style.left = (shown * 100).toFixed(2) + '%';
  // tick marks on move boundaries
  if (!els.progress.querySelector('.pt')){
    for (let i = 0; i < STEPS.length; i++){
      if (STEPS[i].kind === 'move'){
        const d = document.createElement('div');
        d.className = 'pt';
        d.style.left = ((i + 1) / STEPS.length * 100) + '%';
        els.progress.appendChild(d);
      }
    }
  }
  els.progress.querySelectorAll('.pt').forEach(p => {
    const at = parseFloat(p.style.left) / 100;
    p.classList.toggle('past', at <= shown + 1e-6);
  });
}

function setPlaying(p){
  state.playing = p;
  els.icPlay.style.display = p ? 'none' : '';
  els.icPause.style.display = p ? '' : 'none';
  els.playLbl.textContent = p ? 'Pause' : 'Play';
  els.btnPrev.disabled = state.step <= 0;
  els.btnNext.disabled = state.step >= STEPS.length - 1;
}

function showCaption(step){
  if (!step){ els.cap.classList.add('hide'); return; }
  els.capTitle.textContent = step.title;
  els.capText.innerHTML = step.text;
  els.cap.classList.toggle('warn', !!step.warn);
  els.cap.classList.toggle('good', !!step.good);
  els.cap.classList.remove('hide');
}

/* Apply step visuals & (for move steps) animate the piece */
function enterStep(i){
  const step = STEPS[i];
  state.step = i;
  state.stepElapsed = 0;
  state.holdTimer = 0;
  state.animDone = step.kind !== 'move';

  showCaption(step);

  if (step.kind === 'move'){
    const m = MOVES[step.idx];
    // safety: rebuild board exactly to pre-move state
    if (state.moveIdx !== step.idx){
      state.moveIdx = step.idx;
      spawnPieces(boardAfter(step.idx));
    }
    const target = sqToView(m.to);
    const from = sqToView(m.from);
    const dist = Math.hypot(target.col - from.col, target.row - from.row);
    const dur = 0.55 + Math.min(dist, 8) * 0.085;
    if (m.capture){
      const captured = removePieceMesh(m.to);
      if (captured){
        anims.push({ mesh: captured, x0: captured.position.x, y0: captured.position.y,
          x1: captured.position.x + (m.color === 'w' ? -0.12 : 0.12),
          y1: captured.position.y - 0.14, dur: dur * 0.6, t: 0, fade: true, arc: 0 });
      }
    }
    const mesh = movePieceMesh(m.from, m.to);
    if (mesh){
      const isKnight = m.piece === 'N';
      animateMove(mesh, m.from, m.to, dur, isKnight ? 0.35 : 0.04);
    }
    state.animDuration = dur;
    drawHighlights(step.hl || []);   // highlights appear during the move
    state.moveIdx = step.idx + 1;
    refreshMoveList();
  } else {
    drawHighlights(step.hl || []);
  }

  // arrows fade in slightly after the move starts
  if (step.arrows && step.arrows.length){
    state.arrowDelay = step.kind === 'move' ? 0.45 : 0;
  } else state.arrowDelay = -1;

  refreshProgress();
  setPlaying(state.playing);
  els.btnPrev.disabled = state.step <= 0;
  els.btnNext.disabled = state.step >= STEPS.length - 1;
}

function updateArrows(dt){
  const step = STEPS[state.step];
  if (!step || !step.arrows || !step.arrows.length) return;
  if (state.arrowDelay < 0) return;
  state.arrowDelay -= dt;
  if (state.arrowDelay <= 0){
    clearOverlay();
    drawHighlights(step.hl || []);
    for (const a of step.arrows) drawArrow(a.from, a.to, a.color, a.width || 0.16);
    state.arrowDelay = -1;
  }
}

function finishStep(){
  const step = STEPS[state.step];
  if (state.step >= STEPS.length - 1){
    setPlaying(false);
    return;
  }
  enterStep(state.step + 1);
}

/* Jump so that exactly `k` half-moves are applied; show the move list at k */
function gotoMove(k){
  k = Math.max(0, Math.min(MOVES.length, k));
  // find the latest step whose move state matches k
  let best = 0;
  for (let i = 0; i < STEPS.length; i++){
    const s = STEPS[i];
    const st = s.kind === 'move' ? s.idx + 1 : s.moveIdx;
    if (st <= k) best = i;
  }
  enterStep(best);
  // if we're not playing, still render
  setPlaying(state.playing);
}

/* ---------- controls ---------- */
els.btnPlay.addEventListener('click', () => {
  if (state.step < 0){ enterStep(0); setPlaying(true); return; }
  if (state.step >= STEPS.length - 1 && !state.playing){ replay(); return; }
  setPlaying(!state.playing);
});
els.btnNext.addEventListener('click', () => {
  if (state.step >= STEPS.length - 1) return;
  const wasPlaying = state.playing;
  setPlaying(false);
  enterStep(state.step + 1);
  if (wasPlaying) setPlaying(true);
});
els.btnPrev.addEventListener('click', () => {
  if (state.step <= 0) return;
  setPlaying(false);
  enterStep(state.step - 1);
});
els.btnReplay.addEventListener('click', () => replay());
function replay(){
  state.moveIdx = 0;
  spawnPieces(initialBoard());
  enterStep(0);
  setPlaying(true);
}

/* scrubbing on the progress bar maps to steps */
let scrubbing = false;
function scrubTo(clientX){
  const r = els.progress.getBoundingClientRect();
  const t = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  const target = Math.round(t * (STEPS.length - 1));
  if (target !== state.step){
    setPlaying(false);
    // rebuild board to correct move count for target step
    const s = STEPS[target];
    const needMoves = s.kind === 'move' ? s.idx : s.moveIdx;
    if (state.moveIdx !== (s.kind === 'move' ? s.idx : s.moveIdx)){}
    state.moveIdx = needMoves;
    spawnPieces(boardAfter(needMoves));
    enterStep(target);
  }
}
els.progress.addEventListener('pointerdown', e => { scrubbing = true; scrubTo(e.clientX); });
window.addEventListener('pointermove', e => { if (scrubbing) scrubTo(e.clientX); });
window.addEventListener('pointerup', () => scrubbing = false);

/* keyboard */
window.addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); els.btnPlay.click(); }
  else if (e.code === 'ArrowRight'){ els.btnNext.click(); }
  else if (e.code === 'ArrowLeft'){ els.btnPrev.click(); }
  else if (e.key === 'r' || e.key === 'R'){ replay(); }
});

/* ============================================================
   Main loop
============================================================ */
const clock = new THREE.Clock();
const FAST = true; // temporary debug aid
function tick(){
  requestAnimationFrame(tick);
  let dt = Math.min(clock.getDelta(), 0.05);
  if (FAST) dt *= 18;

  // piece animations
  for (let i = anims.length - 1; i >= 0; i--){
    const a = anims[i];
    a.t += dt / a.dur;
    const t = Math.min(1, a.t);
    const e = easeInOut(t);
    a.mesh.position.x = a.x0 + (a.x1 - a.x0) * e;
    a.mesh.position.y = a.y0 + (a.y1 - a.y0) * e + Math.sin(t * Math.PI) * a.arc;
    if (a.fade){
      a.mesh.material.opacity = 1 - t;
      a.mesh.material.transparent = true;
    }
    if (t >= 1){
      anims.splice(i, 1);
      if (a.fade) piecesGroup.remove(a.mesh);
    }
  }

  // arrows timing
  updateArrows(dt);

  // step timing
  if (state.playing && state.step >= 0){
    const step = STEPS[state.step];
    if (step.kind === 'move' && !state.animDone){
      state.holdTimer += dt;
      if (state.holdTimer >= state.animDuration + 0.25) state.animDone = true;
    }
    if (state.animDone){
      state.stepElapsed += dt;
      if (state.stepElapsed >= step.dur) finishStep();
    }
  }

  // gentle idle drift on the last step's highlight breathing
  renderer.render(scene, camera);
}

/* ============================================================
   Boot
============================================================ */
srand(0xC0FFEE);
buildScene();
spawnPieces(initialBoard());
buildMoveList();
resize();
refreshProgress();
refreshMoveList();
showCaption(null);
tick();

/* autoplay shortly after first paint */
setTimeout(() => { enterStep(0); setPlaying(true); }, 650);
</script>
