<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eiffel — a toon postcard</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1226; }
  canvas { display: block; }
  #ui {
    position: fixed; inset: 0; pointer-events: none;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  #title { position: absolute; top: 18px; left: 24px; color: #fff8ec; }
  #title h1 {
    margin: 0; font-size: 27px; font-weight: 900; letter-spacing: .16em;
    text-shadow: 0 2px 0 rgba(30, 22, 12, .6);
  }
  #title p {
    margin: 3px 0 0; font-size: 12.5px; font-weight: 600; opacity: .92;
    text-shadow: 0 1px 0 rgba(30, 22, 12, .45);
    animation: hintfade 1s ease 7s forwards;
  }
  @keyframes hintfade { to { opacity: 0; } }
  #tod {
    position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; pointer-events: auto;
  }
  #tod button {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 18px; border-radius: 999px;
    border: 3px solid #241c10; background: #fff6e3; color: #241c10;
    font: 800 14px/1 system-ui, sans-serif; cursor: pointer;
    box-shadow: 0 4px 0 #241c10;
    transition: transform .08s, box-shadow .08s, background .3s;
  }
  #tod button:hover { transform: translateY(-1px); box-shadow: 0 5px 0 #241c10; }
  #tod button:active { transform: translateY(3px); box-shadow: 0 1px 0 #241c10; }
  #tod button.on[data-tod="day"]   { background: #ffd75e; }
  #tod button.on[data-tod="dusk"]  { background: #ff9e5a; }
  #tod button.on[data-tod="night"] { background: #31427c; color: #fff; }
  .dot {
    width: 11px; height: 11px; border-radius: 50%; border: 2px solid #241c10;
  }
  .dot-day { background: #ffd75e; }
  .dot-dusk { background: #ff8a4a; }
  .dot-night { background: #101a3d; }
  #tod button.on[data-tod="night"] .dot-night { border-color: #fff; }
</style>
<script type="importmap">
{ "imports": {
    "three": "../../../vendor/three/build/three.module.js",
    "three/addons/": "../../../vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <div id="title">
    <h1>EIFFEL</h1>
    <p>a toon postcard &mdash; drag to orbit, scroll to zoom, keys 1&ndash;3 switch the hour</p>
  </div>
  <div id="tod">
    <button data-tod="day" class="on"><i class="dot dot-day"></i>Day</button>
    <button data-tod="dusk"><i class="dot dot-dusk"></i>Dusk</button>
    <button data-tod="night"><i class="dot dot-night"></i>Night</button>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
