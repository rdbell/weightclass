<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tour Eiffel — Toon Viewer</title>
<style>
	:root {
		--ink: #2b2438;
		--paper: #fff7e6;
	}
	* { box-sizing: border-box; }
	html, body {
		margin: 0; padding: 0; width: 100%; height: 100%;
		overflow: hidden; background: #0d1226;
		font-family: "Trebuchet MS", "Segoe UI", Tahoma, Verdana, sans-serif;
	}
	canvas { display: block; }

	#ui {
		position: fixed; inset: 0; pointer-events: none;
		display: flex; flex-direction: column; justify-content: space-between;
		padding: clamp(12px, 2.4vw, 28px);
	}
	.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
	.title {
		color: var(--paper);
		text-shadow: 0 2px 0 rgba(24, 16, 40, .45), 0 6px 18px rgba(10, 8, 24, .35);
		line-height: 1;
	}
	.title h1 { margin: 0; font-size: clamp(19px, 3.1vw, 34px); letter-spacing: .09em; text-transform: uppercase; }
	.title p { margin: .45em 0 0; font-size: clamp(11px, 1.15vw, 13px); letter-spacing: .16em; text-transform: uppercase; opacity: .78; }

	/* time of day toggle */
	.tod {
		pointer-events: auto;
		display: flex; gap: 4px; padding: 5px;
		background: rgba(24, 18, 42, .42);
		border: 2px solid rgba(255, 247, 230, .5);
		border-radius: 999px;
		backdrop-filter: blur(6px);
		box-shadow: 0 6px 0 rgba(20, 14, 34, .25);
	}
	.tod button {
		-webkit-appearance: none; appearance: none;
		font: inherit; font-size: clamp(11px, 1.1vw, 13px); letter-spacing: .13em; text-transform: uppercase;
		color: #fff7e6; background: transparent; border: 0; border-radius: 999px;
		padding: .62em 1.1em; cursor: pointer; transition: background .18s, color .18s, transform .12s;
	}
	.tod button:hover { background: rgba(255, 247, 230, .18); }
	.tod button:active { transform: translateY(1px); }
	.tod button[aria-pressed="true"] { background: #fff7e6; color: #35264a; font-weight: bold; }
	.tod button:focus-visible { outline: 3px solid #ffd166; outline-offset: 2px; }

	.foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
	.hint {
		color: var(--paper); opacity: .72; font-size: clamp(10px, 1vw, 12px);
		letter-spacing: .13em; text-transform: uppercase;
		text-shadow: 0 2px 6px rgba(10, 8, 24, .5);
	}
	.badge {
		color: var(--paper); opacity: .55; font-size: clamp(10px, 1vw, 12px);
		letter-spacing: .13em; text-transform: uppercase;
	}
	#boot {
		position: fixed; inset: 0; display: grid; place-content: center; gap: 14px;
		background: #131a33; color: #fff7e6; z-index: 5;
		letter-spacing: .2em; text-transform: uppercase; font-size: 13px;
		transition: opacity .6s ease; text-align: center;
	}
	#boot.done { opacity: 0; pointer-events: none; }
	@media (max-width: 640px) {
		.head { flex-direction: column; }
		.badge { display: none; }
	}
</style>
<script>
	// Read the requested time of day before the module loads so the very first
	// frame is already in the right mood.
	window.TOD = (() => {
		const q = new URLSearchParams(location.search).get('tod');
		return (q === 'dusk' || q === 'night') ? q : 'day';
	})();
</script>
<script type="importmap">
{ "imports": {
	"three": "../../../vendor/three/build/three.module.js",
	"three/addons/": "../../../vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
	<div id="ui">
		<div class="head">
			<div class="title">
				<h1>La Tour Eiffel</h1>
				<p>Champ de Mars &middot; Paris</p>
			</div>
			<div class="tod" id="tod" role="group" aria-label="Time of day">
				<button data-tod="day" aria-pressed="false">Day</button>
				<button data-tod="dusk" aria-pressed="false">Dusk</button>
				<button data-tod="night" aria-pressed="false">Night</button>
			</div>
		</div>
		<div class="foot">
			<div class="hint">Drag to orbit &middot; scroll or pinch to zoom &middot; keys 1 / 2 / 3</div>
			<div class="badge">Cel-shaded viewer</div>
		</div>
	</div>
	<div id="boot">Building the tower&hellip;</div>
	<script type="module" src="./src/main.js"></script>
</body>
</html>
