<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Tour Eiffel — Toon Adventure</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0f1e; }
  canvas { display: block; }
  #ui {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    user-select: none; z-index: 10;
  }
  #title {
    color: #fff; font-weight: 800; font-size: 20px; letter-spacing: 2px;
    text-shadow: 0 2px 0 rgba(20,10,0,.55), 0 4px 12px rgba(0,0,0,.35);
  }
  #modes { display: flex; gap: 8px; }
  .mode-btn {
    appearance: none; border: 3px solid #2b1c10; border-radius: 999px;
    padding: 7px 18px; font: 800 14px "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    letter-spacing: 1px; cursor: pointer; color: #2b1c10;
    background: #fff8ea; box-shadow: 0 3px 0 #2b1c10;
    transition: transform .08s ease, background .15s ease, color .15s ease;
  }
  .mode-btn:hover { transform: translateY(-1px); }
  .mode-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #2b1c10; }
  .mode-btn.active { background: #ffb43a; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
  #hint {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,.85); font: 600 12px "Trebuchet MS", system-ui, sans-serif;
    letter-spacing: 1px; text-shadow: 0 1px 3px rgba(0,0,0,.6); z-index: 10;
    pointer-events: none; white-space: nowrap;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "../../../vendor/three/build/three.module.js",
    "three/addons/": "../../../vendor/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="ui">
  <div id="title">LA TOUR EIFFEL</div>
  <div id="modes">
    <button class="mode-btn" data-mode="day">DAY</button>
    <button class="mode-btn" data-mode="dusk">DUSK</button>
    <button class="mode-btn" data-mode="night">NIGHT</button>
  </div>
</div>
<div id="hint">drag to orbit &nbsp;•&nbsp; scroll to zoom</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   Renderer / scene / camera
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap; // crisp-but-not-jagged toon shadows
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfe9f7, 400, 1600);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 4000);
camera.position.set(255, 240, 445);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 115, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 70;
controls.maxDistance = 800;
controls.maxPolarAngle = 1.545;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.addEventListener('start', () => { controls.autoRotate = false; });

// Ink outlines: renders every material once more as a slightly fattened black hull.
const effect = new OutlineEffect(renderer, { defaultThickness: 0.0032, defaultColor: [0.10, 0.06, 0.03] });

/* ============================================================
   Toon gradient (hard light bands) + material helper
   ============================================================ */
const steps = new Uint8Array([70, 135, 200, 255]);
const gradientMap = new THREE.DataTexture(steps, steps.length, 1, THREE.RedFormat);
gradientMap.minFilter = THREE.NearestFilter;
gradientMap.magFilter = THREE.NearestFilter;
gradientMap.generateMipmaps = false;
gradientMap.needsUpdate = true;

function toonMat(color, opts = {}) {
  const m = new THREE.MeshToonMaterial({ color, gradientMap, ...opts });
  m.userData.outlineParameters = {
    thickness: opts.outlineThickness ?? 0.0032,
    color: opts.outlineColor ?? [0.10, 0.06, 0.03],
    visible: opts.outline !== false,
  };
  return m;
}

/* ============================================================
   Lights
   ============================================================ */
const sunLight = new THREE.DirectionalLight(0xfff2cc, 2.6);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -420;
sunLight.shadow.camera.right = 420;
sunLight.shadow.camera.top = 500;
sunLight.shadow.camera.bottom = -80;
sunLight.shadow.camera.near = 20;
sunLight.shadow.camera.far = 1400;
sunLight.shadow.bias = -0.0006;
sunLight.shadow.normalBias = 1.4;
scene.add(sunLight, sunLight.target);

const hemiLight = new THREE.HemisphereLight(0xbfe0ff, 0x7d9a58, 0.85);
scene.add(hemiLight);

/* ============================================================
   Sky dome — banded cartoon gradient (hard steps, no gradient)
   ============================================================ */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  fog: false,
  uniforms: {
    uTop: { value: new THREE.Color(0x3e8ee6) },
    uMid: { value: new THREE.Color(0x8fd0f7) },
    uHor: { value: new THREE.Color(0xd8f0ff) },
    uBot: { value: new THREE.Color(0xbfe4f2) },
  },
  vertexShader: /* glsl */`
    varying vec3 vDir;
    void main() {
      vDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform vec3 uTop, uMid, uHor, uBot;
    varying vec3 vDir;
    void main() {
      float h = vDir.y;
      vec3 c = uBot;
      if (h > 0.0)  c = uHor;
      if (h > 0.14) c = uMid;
      if (h > 0.45) c = uTop;
      gl_FragColor = vec4(c, 1.0);
    }`,
});
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(1800, 24, 14), skyMat);
skyMat.userData.outlineParameters = { visible: false };
scene.add(skyDome);

// Sun & moon discs
function disc(r, color) {
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1, fog: false });
  mat.userData.outlineParameters = { visible: false };
  const m = new THREE.Mesh(new THREE.CircleGeometry(r, 40), mat);
  return m;
}
const sunDisc = disc(46, 0xffe066);
const moonDisc = disc(34, 0xe8eefc);
// moon craters (flat darker blobs stuck on the disc)
const craterMat = new THREE.MeshBasicMaterial({ color: 0xc6d2e8, transparent: true, opacity: 1, fog: false });
craterMat.userData.outlineParameters = { visible: false };
[[9, 8, 0.4], [-8, -4, 0.25], [2, -11, 0.18]].forEach(([x, y, s]) => {
  const c = new THREE.Mesh(new THREE.CircleGeometry(7 * (0.6 + s), 20), craterMat);
  c.position.set(x, y, 0.5);
  moonDisc.add(c);
});
scene.add(sunDisc, moonDisc);

// Stars
{
  const n = 650, pos = new Float32Array(n * 3);
  const rnd = mulberry32(7);
  for (let i = 0; i < n; i++) {
    const a = rnd() * Math.PI * 2, e = Math.asin(0.08 + rnd() * 0.92);
    const r = 1650;
    pos[i * 3] = Math.cos(a) * Math.cos(e) * r;
    pos[i * 3 + 1] = Math.sin(e) * r;
    pos[i * 3 + 2] = Math.sin(a) * Math.cos(e) * r;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  var starMat = new THREE.PointsMaterial({
    color: 0xd6e4ff, size: 2.6, sizeAttenuation: false,
    transparent: true, opacity: 0, fog: false, depthWrite: false,
  });
  starMat.userData.outlineParameters = { visible: false };
  const stars = new THREE.Points(g, starMat);
  scene.add(stars);
}

/* ============================================================
   The Eiffel Tower — procedural iron lattice
   ============================================================ */
const H1 = 57, H2 = 115, HT = 276;                 // platform heights
function radiusAt(y) { return 5 + 55 * Math.exp(-y / 62); } // signature curved taper

const towerGeos = [];
const UP = new THREE.Vector3(0, 1, 0);
const _dir = new THREE.Vector3(), _mid = new THREE.Vector3(), _q = new THREE.Quaternion();

function beam(a, b, t, scaleXY = 1) {
  _dir.subVectors(b, a);
  const len = _dir.length();
  if (len < 0.01) return;
  const g = new THREE.BoxGeometry(t * scaleXY, len, t * scaleXY);
  _q.setFromUnitVectors(UP, _dir.normalize());
  _mid.addVectors(a, b).multiplyScalar(0.5);
  g.applyMatrix4(new THREE.Matrix4().compose(_mid, _q, new THREE.Vector3(1, 1, 1)));
  towerGeos.push(g);
}

function beamThickness(y) { return THREE.MathUtils.lerp(3.0, 1.5, Math.min(y / H2, 1)); }

const corners = [[1, 1], [1, -1], [-1, -1], [-1, 1]];

// Four curved corner girders (base -> 2nd platform) and continuing shaft (2nd platform -> top)
function buildSection(y0, y1, nSteps, columnT) {
  const ys = [];
  for (let i = 0; i <= nSteps; i++) ys.push(THREE.MathUtils.lerp(y0, y1, i / nSteps));

  // corner columns
  for (const [sx, sz] of corners) {
    for (let i = 0; i < nSteps; i++) {
      const t = THREE.MathUtils.lerp(columnT, columnT * 0.55, i / nSteps);
      beam(
        new THREE.Vector3(sx * radiusAt(ys[i]), ys[i], sz * radiusAt(ys[i])),
        new THREE.Vector3(sx * radiusAt(ys[i + 1]), ys[i + 1], sz * radiusAt(ys[i + 1])),
        t
      );
    }
  }
  // per face: struts + X bracing
  for (let i = 0; i < nSteps; i++) {
    const r0 = radiusAt(ys[i]), r1 = radiusAt(ys[i + 1]);
    const t = beamThickness(ys[i]);
    // horizontal ring (4 struts)
    for (const [sx, sz] of corners) {
      const nx = sz, nz = -sx; // next corner (rotated 90°)
      beam(new THREE.Vector3(sx * r0, ys[i], sz * r0), new THREE.Vector3(nx * r0, ys[i], nz * r0), t * 0.7);
    }
    // X braces on each face
    for (let f = 0; f < 4; f++) {
      const [sx, sz] = corners[f];
      const [nx, nz] = corners[(f + 1) % 4];
      const A  = new THREE.Vector3(sx * r0, ys[i],     sz * r0);
      const B  = new THREE.Vector3(nx * r0, ys[i],     nz * r0);
      const A2 = new THREE.Vector3(sx * r1, ys[i + 1], sz * r1);
      const B2 = new THREE.Vector3(nx * r1, ys[i + 1], nz * r1);
      beam(A, B2, t * 0.5);
      beam(B, A2, t * 0.5);
    }
  }
}
buildSection(0, H2, 10, 3.0);
buildSection(H2, HT, 13, 1.5);

// The four iconic arches under the 1st platform
for (let f = 0; f < 4; f++) {
  const R = 31;
  const yc = 62 * Math.log(55 / (R - 5)); // height where legs sit exactly at radius R
  const g = new THREE.TorusGeometry(R, 1.9, 8, 30, Math.PI);
  g.scale(1, 0.5, 1);
  const yEnd = yc;
  const zFace = radiusAt(yEnd);
  const m = new THREE.Matrix4()
    .makeRotationY(f * Math.PI / 2)
    .setPosition(0, 0, 0);
  g.applyMatrix4(new THREE.Matrix4().makeScale(1, 1, 1));
  g.applyMatrix4(new THREE.Matrix4().makeTranslation(0, yEnd, zFace));
  g.applyMatrix4(m);
  towerGeos.push(g);
}

// Platforms (two floors + top cabin)
function slab(w, h, y, z = 0) {
  const g = new THREE.BoxGeometry(w, h, w);
  g.translate(0, y, z);
  towerGeos.push(g);
}
const r1 = radiusAt(H1), r2 = radiusAt(H2), r3 = radiusAt(HT);
slab(2 * r1 + 9, 4.5, H1 + 2);
slab(2 * r1 + 15, 1.6, H1 + 5.2);   // wide thin lip under the floor
slab(2 * r2 + 8, 4, H2 + 2);
slab(2 * r2 + 13, 1.5, H2 + 4.6);
slab(2 * r3 + 7, 4, HT + 2);
slab(11, 5.5, HT + 6.8);            // top cabin

// Antenna mast
{
  const g = new THREE.CylinderGeometry(1.1, 1.7, 26, 10);
  g.translate(0, HT + 9.5 + 13, 0);
  towerGeos.push(g);
  const d1 = new THREE.CylinderGeometry(3.2, 3.2, 1, 10); d1.translate(0, HT + 28, 0); towerGeos.push(d1);
  const d2 = new THREE.CylinderGeometry(2.2, 2.2, 1, 10); d2.translate(0, HT + 34, 0); towerGeos.push(d2);
}

const towerGeo = mergeGeometries(towerGeos);
const towerMat = toonMat(0xa9683a);
const tower = new THREE.Mesh(towerGeo, towerMat);
tower.castShadow = true;
tower.receiveShadow = true;
scene.add(tower);

// Twinkling night sparkles on the lattice faces
const SPARK_N = 420;
const sparkPos = new Float32Array(SPARK_N * 3);
const sparkPhase = new Float32Array(SPARK_N);
{
  const rnd = mulberry32(1234);
  for (let i = 0; i < SPARK_N; i++) {
    const y = 12 + Math.pow(rnd(), 1.4) * (HT - 20);
    const s = radiusAt(y);
    const face = Math.floor(rnd() * 4);
    const off = (rnd() * 2 - 1) * s * 0.92;
    const x = face === 0 ? off : face === 1 ? s : face === 2 ? -off : -s;
    const z = face === 0 ? s : face === 1 ? off : face === 2 ? -s : -off;
    sparkPos[i * 3] = x; sparkPos[i * 3 + 1] = y; sparkPos[i * 3 + 2] = z;
    sparkPhase[i] = rnd() * Math.PI * 2;
  }
}
const sparkGeo = new THREE.BufferGeometry();
sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
sparkGeo.setAttribute('aPhase', new THREE.BufferAttribute(sparkPhase, 1));
const sparkMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  uniforms: { uTime: { value: 0 }, uOpacity: { value: 0 } },
  vertexShader: /* glsl */`
    attribute float aPhase;
    uniform float uTime;
    varying float vTw;
    void main() {
      vTw = 0.35 + 0.65 * (0.5 + 0.5 * sin(uTime * 3.2 + aPhase * 7.0));
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = (2.0 + 3.5 * vTw) * (240.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    uniform float uOpacity;
    varying float vTw;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      float a = smoothstep(0.5, 0.12, d) * vTw * uOpacity;
      gl_FragColor = vec4(1.0, 0.92, 0.72, a);
    }`,
});
sparkMat.userData.outlineParameters = { visible: false };
const sparkles = new THREE.Points(sparkGeo, sparkMat);
scene.add(sparkles);

// Beacon on the tip
const beaconMat = new THREE.MeshBasicMaterial({ color: 0x551512 });
beaconMat.userData.outlineParameters = { visible: false };
const beacon = new THREE.Mesh(new THREE.SphereGeometry(2.2, 12, 10), beaconMat);
beacon.position.set(0, HT + 37.5, 0);
scene.add(beacon);

/* ============================================================
   Grounds & park
   ============================================================ */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const groundMat = toonMat(0x6fbf4e, { outline: false });
const lawnMat   = toonMat(0x7ccf58, { outline: false });
const pathMat   = toonMat(0xe0c9a0, { outline: false });
groundMat.userData.outlineParameters = { visible: false };
lawnMat.userData.outlineParameters = { visible: false };
pathMat.userData.outlineParameters = { visible: false };

const ground = new THREE.Mesh(new THREE.CircleGeometry(900, 56), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const lawn = new THREE.Mesh(new THREE.BoxGeometry(112, 0.6, 380), lawnMat);
lawn.position.set(0, 0.3, 272);
lawn.receiveShadow = true;
scene.add(lawn);

for (const x of [-66, 66]) {
  const p = new THREE.Mesh(new THREE.BoxGeometry(11, 0.4, 372), pathMat);
  p.position.set(x, 0.2, 270);
  p.receiveShadow = true;
  scene.add(p);
}

// Trees (merged; vertex-coloured foliage)
const trunkGeos = [], leafGeos = [];
const leafPalette = [new THREE.Color(0x3f9e3f), new THREE.Color(0x2f8f46), new THREE.Color(0x5cb44e)];
function addTree(x, z, s, rnd) {
  const th = (6 + rnd() * 4) * s;
  const trunk = new THREE.CylinderGeometry(0.9 * s, 1.4 * s, th, 6);
  trunk.translate(x, th / 2, z);
  trunkGeos.push(trunk);
  const col = leafPalette[Math.floor(rnd() * leafPalette.length)];
  const blobs = 2 + Math.floor(rnd() * 2);
  for (let b = 0; b < blobs; b++) {
    const r = (3.4 + rnd() * 2.2) * s;
    const g = new THREE.SphereGeometry(r, 8, 6);
    g.translate(x + (rnd() - 0.5) * 2.4 * s, th + r * 0.55 + b * r * 0.75, z + (rnd() - 0.5) * 2.4 * s);
    const n = g.attributes.position.count;
    const colors = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b; }
    g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    leafGeos.push(g);
  }
}
{
  const rnd = mulberry32(42);
  // alleys along the lawn
  for (const x of [-80, 80]) for (let z = 110; z <= 440; z += 46) addTree(x + (rnd() - 0.5) * 6, z, 1.1 + rnd() * 0.5, rnd);
  // scattered groves
  let placed = 0, guard = 0;
  while (placed < 26 && guard++ < 300) {
    const x = (rnd() * 2 - 1) * 560, z = (rnd() * 2 - 1) * 560;
    const d = Math.hypot(x, z);
    if (d < 105) continue;
    if (Math.abs(x) < 78 && z > 55 && z < 470) continue; // keep the lawn clear
    addTree(x, z, 0.9 + rnd() * 0.9, rnd);
    placed++;
  }
}
const trunkMat = toonMat(0x8a5a35, { outlineColor: [0.18, 0.1, 0.05] });
const trunkMesh = new THREE.Mesh(mergeGeometries(trunkGeos), trunkMat);
trunkMesh.castShadow = true; trunkMesh.receiveShadow = true;
scene.add(trunkMesh);

const leafMat = toonMat(0xffffff, { vertexColors: true, outlineColor: [0.05, 0.16, 0.05] });
const leafMesh = new THREE.Mesh(mergeGeometries(leafGeos), leafMat);
leafMesh.castShadow = true; leafMesh.receiveShadow = true;
scene.add(leafMesh);

// Lamp posts along the paths
const postGeos = [], lampGeos = [];
{
  const rnd = mulberry32(9);
  for (const x of [-66, 66]) for (const z of [130, 210, 290, 370]) {
    const post = new THREE.CylinderGeometry(0.55, 0.8, 15, 6);
    post.translate(x, 7.5, z);
    postGeos.push(post);
    const lamp = new THREE.SphereGeometry(1.9, 10, 8);
    lamp.translate(x, 16, z);
    lampGeos.push(lamp);
  }
}
const postMat = toonMat(0x2a2a35, { outline: false });
const postMesh = new THREE.Mesh(mergeGeometries(postGeos), postMat);
postMesh.castShadow = true;
scene.add(postMesh);
const lampGlowMat = new THREE.MeshBasicMaterial({ color: 0x6a5a40 });
lampGlowMat.userData.outlineParameters = { visible: false };
const lampMesh = new THREE.Mesh(mergeGeometries(lampGeos), lampGlowMat);
scene.add(lampMesh);

const lampLight1 = new THREE.PointLight(0xffc766, 0, 210, 1.8);
const lampLight2 = new THREE.PointLight(0xffc766, 0, 210, 1.8);
lampLight1.position.set(-66, 18, 250);
lampLight2.position.set(66, 18, 250);
scene.add(lampLight1, lampLight2);

// Distant cartoon skyline
const bldgGeos = [];
{
  const rnd = mulberry32(2024);
  for (let i = 0; i < 22; i++) {
    const a = (i / 22) * Math.PI * 2 + rnd() * 0.2;
    const rad = 540 + rnd() * 140;
    const w = 34 + rnd() * 44, d = 34 + rnd() * 44, h = 28 + rnd() * 80;
    const g = new THREE.BoxGeometry(w, h, d);
    g.rotateY(-a);
    g.translate(Math.cos(a) * rad, h / 2, Math.sin(a) * rad);
    bldgGeos.push(g);
  }
}
const bldgMat = toonMat(0xd8c8b0, { outline: false });
bldgMat.userData.outlineParameters = { visible: false };
const bldgMesh = new THREE.Mesh(mergeGeometries(bldgGeos), bldgMat);
scene.add(bldgMesh);

/* ============================================================
   Clouds (drifting, casting soft-moving shadows)
   ============================================================ */
const cloudMat = toonMat(0xffffff, { transparent: true, opacity: 1, outlineThickness: 0.0018 });
const clouds = [];
{
  const rnd = mulberry32(555);
  for (let i = 0; i < 6; i++) {
    const parts = [];
    const n = 4 + Math.floor(rnd() * 3);
    for (let b = 0; b < n; b++) {
      const r = 9 + rnd() * 10;
      const g = new THREE.SphereGeometry(r, 9, 7);
      g.scale(1, 0.55, 1);
      g.translate((rnd() - 0.5) * 34, (rnd() - 0.5) * 5, (rnd() - 0.5) * 16);
      parts.push(g);
    }
    const mesh = new THREE.Mesh(mergeGeometries(parts), cloudMat);
    mesh.castShadow = true;
    const a = rnd() * Math.PI * 2, rad = 240 + rnd() * 320;
    mesh.position.set(Math.cos(a) * rad, 195 + rnd() * 70, Math.sin(a) * rad);
    mesh.userData.speed = 1.2 + rnd() * 1.6;
    scene.add(mesh);
    clouds.push(mesh);
  }
}

/* ============================================================
   Birds
   ============================================================ */
const birdMat = new THREE.MeshBasicMaterial({ color: 0x23303f, side: THREE.DoubleSide });
birdMat.userData.outlineParameters = { visible: false };
const birds = [];
{
  const rnd = mulberry32(31);
  for (let i = 0; i < 5; i++) {
    const g = new THREE.Group();
    const wingGeo = new THREE.PlaneGeometry(5.5, 1.7);
    const wL = new THREE.Mesh(wingGeo, birdMat); wL.position.x = -2.7;
    const wR = new THREE.Mesh(wingGeo, birdMat); wR.position.x = 2.7;
    g.add(wL, wR);
    g.userData = {
      wL, wR,
      radius: 90 + rnd() * 110,
      height: 130 + rnd() * 90,
      speed: (0.12 + rnd() * 0.1) * (rnd() > 0.5 ? 1 : -1),
      phase: rnd() * Math.PI * 2,
      flap: 7 + rnd() * 4,
    };
    scene.add(g);
    birds.push(g);
  }
}

/* ============================================================
   Time-of-day palettes
   ============================================================ */
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const MODES = {
  day: {
    skyTop: 0x3e8ee6, skyMid: 0x8fd0f7, skyHor: 0xd8f0ff, skyBot: 0xbfe4f2,
    fog: 0xcfe9f7, fogNear: 420, fogFar: 1700,
    sunDir: V3(0.45, 0.62, 0.35), sunColor: 0xfff2cc, sunInt: 2.6,
    hemiSky: 0xbfe0ff, hemiGround: 0x7d9a58, hemiInt: 0.85,
    grass: 0x6fbf4e, lawn: 0x7ccf58, path: 0xe0c9a0, trunk: 0x8a5a35,
    leafTint: 0xffffff, tower: 0xa9683a, towerEmis: 0x000000, towerEmisInt: 0,
    bldg: 0xd8c8b0, cloud: 0xffffff, cloudOp: 1,
    starOp: 0, sparkle: 0, lampGlow: 0, lampLight: 0, beacon: 0.25,
    sunOp: 1, sunDiscCol: 0xffe066, moonOp: 0, birds: 1,
  },
  dusk: {
    skyTop: 0x4a3d8f, skyMid: 0xef8a5f, skyHor: 0xffd9a3, skyBot: 0xe8b07a,
    fog: 0xf0b98c, fogNear: 360, fogFar: 1500,
    sunDir: V3(0.85, 0.16, -0.35), sunColor: 0xffa04d, sunInt: 2.2,
    hemiSky: 0xcf9fd8, hemiGround: 0x6a5570, hemiInt: 0.6,
    grass: 0x5f9e46, lawn: 0x6aa850, path: 0xcaa87e, trunk: 0x6e4a2e,
    leafTint: 0xd0c4ea, tower: 0xa05c30, towerEmis: 0x55280a, towerEmisInt: 0.35,
    bldg: 0x8f7aa8, cloud: 0xffc9a3, cloudOp: 1,
    starOp: 0.25, sparkle: 0.5, lampGlow: 0.7, lampLight: 0.45, beacon: 0.8,
    sunOp: 1, sunDiscCol: 0xff7a33, moonOp: 0, birds: 0.6,
  },
  night: {
    skyTop: 0x0a1330, skyMid: 0x1a2c55, skyHor: 0x27406b, skyBot: 0x1a2a4a,
    fog: 0x0e1830, fogNear: 300, fogFar: 1400,
    sunDir: V3(-0.5, 0.6, -0.45), sunColor: 0xa9c3ff, sunInt: 1.5,
    hemiSky: 0x2c3e6e, hemiGround: 0x131a2c, hemiInt: 0.55,
    grass: 0x2f5e3e, lawn: 0x356847, path: 0x5f5a4c, trunk: 0x4a3826,
    leafTint: 0x5a6f96, tower: 0xd9a95e, towerEmis: 0x8a5418, towerEmisInt: 0.6,
    bldg: 0x2c3a5e, cloud: 0x3a4a6e, cloudOp: 0.9,
    starOp: 1, sparkle: 1, lampGlow: 1, lampLight: 1, beacon: 1,
    sunOp: 0, sunDiscCol: 0xffe066, moonOp: 1, birds: 0,
  },
};

const cur = {};
const target = {};
function snapshot(mode, into) {
  for (const [k, v] of Object.entries(MODES[mode])) {
    into[k] = (v && (v.isColor || v.isVector3)) ? v.clone() : v;
  }
  // normalize hex numbers into Colors
  const colorKeys = ['skyTop','skyMid','skyHor','skyBot','fog','sunColor','hemiSky','hemiGround',
    'grass','lawn','path','trunk','leafTint','tower','towerEmis','bldg','cloud','sunDiscCol'];
  for (const k of colorKeys) if (typeof into[k] === 'number') into[k] = new THREE.Color(k.startsWith('towerEmis') ? into[k] : into[k]);
}
snapshot('day', cur);
let mode = 'day';

const params = new URLSearchParams(location.search);
const initial = (params.get('tod') || '').toLowerCase();
if (MODES[initial]) mode = initial;
snapshot(mode, target);
setModeUI(mode);

function setMode(m) {
  if (!MODES[m]) return;
  mode = m;
  snapshot(m, target);
  setModeUI(m);
  try { history.replaceState(null, '', m === 'day' ? location.pathname : `?tod=${m}`); } catch (e) {}
}

function setModeUI(m) {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
}
document.querySelectorAll('.mode-btn').forEach(b =>
  b.addEventListener('click', () => setMode(b.dataset.mode))
);

const LAMP_DIM = new THREE.Color(0x6a5a40);
const LAMP_BRIGHT = new THREE.Color(0xffd97a);
const BEACON_DIM = new THREE.Color(0x551512);
const BEACON_BRIGHT = new THREE.Color(0xff4455);
const _c = new THREE.Color();

/* ============================================================
   Animation loop
   ============================================================ */
const clock = new THREE.Clock();
let elapsed = 0;

function applyState() {
  skyMat.uniforms.uTop.value.copy(cur.skyTop);
  skyMat.uniforms.uMid.value.copy(cur.skyMid);
  skyMat.uniforms.uHor.value.copy(cur.skyHor);
  skyMat.uniforms.uBot.value.copy(cur.skyBot);

  scene.fog.color.copy(cur.fog);
  scene.fog.near = cur.fogNear;
  scene.fog.far = cur.fogFar;

  sunLight.position.copy(cur.sunDir).normalize().multiplyScalar(560);
  sunLight.color.copy(cur.sunColor);
  sunLight.intensity = cur.sunInt;
  hemiLight.color.copy(cur.hemiSky);
  hemiLight.groundColor.copy(cur.hemiGround);
  hemiLight.intensity = cur.hemiInt;

  groundMat.color.copy(cur.grass);
  lawnMat.color.copy(cur.lawn);
  pathMat.color.copy(cur.path);
  trunkMat.color.copy(cur.trunk);
  leafMat.color.copy(cur.leafTint);
  towerMat.color.copy(cur.tower);
  towerMat.emissive.copy(cur.towerEmis);
  towerMat.emissiveIntensity = cur.towerEmisInt;
  bldgMat.color.copy(cur.bldg);
  cloudMat.color.copy(cur.cloud);
  cloudMat.opacity = cur.cloudOp;

  starMat.opacity = cur.starOp;
  sparkMat.uniforms.uOpacity.value = cur.sparkle;

  lampGlowMat.color.copy(_c.lerpColors(LAMP_DIM, LAMP_BRIGHT, cur.lampGlow));
  lampLight1.intensity = lampLight2.intensity = cur.lampLight * 900;

  sunDisc.material.opacity = cur.sunOp;
  sunDisc.material.color.set(cur.sunDiscCol);
  moonDisc.material.opacity = cur.moonOp;
  craterMat.opacity = cur.moonOp;
  sunDisc.position.copy(cur.sunDir).normalize().multiplyScalar(1500);
  moonDisc.position.copy(cur.sunDir).normalize().multiplyScalar(1500);
  sunDisc.lookAt(camera.position);
  moonDisc.lookAt(camera.position);

  for (const b of birds) {
    const s = cur.birds;
    b.visible = s > 0.02;
    b.scale.setScalar(Math.max(s, 0.001));
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  // smooth transition between palettes
  const k = 1 - Math.exp(-2.6 * dt);
  for (const key in target) {
    const t = target[key], c = cur[key];
    if (t && t.isColor) c.lerp(t, k);
    else if (t && t.isVector3) c.lerp(t, k);
    else cur[key] += (t - cur[key]) * k;
  }
  applyState();

  // world life
  for (const cloud of clouds) {
    cloud.position.x += cloud.userData.speed * dt;
    if (cloud.position.x > 700) cloud.position.x = -700;
  }
  for (const b of birds) {
    const u = b.userData;
    const a = elapsed * u.speed + u.phase;
    b.position.set(Math.cos(a) * u.radius, u.height + Math.sin(elapsed * 0.7 + u.phase) * 8, Math.sin(a) * u.radius);
    b.rotation.y = -a + (u.speed > 0 ? 0 : Math.PI);
    const flap = Math.sin(elapsed * u.flap + u.phase) * 0.55;
    u.wL.rotation.z = flap;
    u.wR.rotation.z = -flap;
  }
  sparkMat.uniforms.uTime.value = elapsed;

  // beacon pulse
  const pulse = 0.55 + 0.45 * Math.sin(elapsed * 4.2);
  beaconMat.color.copy(_c.lerpColors(BEACON_DIM, BEACON_BRIGHT, cur.beacon * pulse));
  beacon.scale.setScalar(0.8 + cur.beacon * 0.4 * pulse);

  controls.update();
  effect.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
