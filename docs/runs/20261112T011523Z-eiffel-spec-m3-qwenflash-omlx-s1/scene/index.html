<!DOCTYPE html>

</style>
<script type="importmap">

</head>
<body>
<div id="ui">
	<button data-tod="day">Day</button>
	<button data-tod="dusk">Dusk</button>
	<button data-tod="night">Night</button>
</div>
<div id="label">Cel-shaded Eiffel Tower: vertex light &rarr; band LUT &rarr; palette LUT &middot; drag to orbit, scroll to zoom</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// The palettes below are authored as final on-screen sRGB values, so turn off
// three's automatic linear/sRGB juggling and let hexes mean what they say.
THREE.ColorManagement.enabled = false;

// ---------------------------------------------------------------------------
// Deterministic randomness
// ---------------------------------------------------------------------------
function mulberry32( seed ) {
	let a = seed >>> 0;
	return function () {
		a = ( a + 0x6D2B79F5 ) >>> 0;
		let t = Math.imul( a ^ ( a >>> 15 ), 1 | a );
		t = ( t + Math.imul( t ^ ( t >>> 7 ), 61 | t ) ) ^ t;
		return ( ( t ^ ( t >>> 14 ) ) >>> 0 ) / 4294967296;
	};
}
const rand = mulberry32( 20261112 );
const randRange = ( lo, hi ) => lo + rand() * ( hi - lo );

// ---------------------------------------------------------------------------
// Renderer / scene / camera
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer( { antialias: true } );
renderer.setPixelRatio( Math.min( window.devicePixelRatio, 2 ) );
renderer.setSize( window.innerWidth, window.innerHeight );
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild( renderer.domElement );

const scene = new THREE.Scene();
scene.background = new THREE.Color( 0x56bce8 );
scene.fog = new THREE.Fog( 0x56bce8, 600, 1700 );

const camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 1, 4000 );
camera.position.set( 330, 165, 430 );

const controls = new OrbitControls( camera, renderer.domElement );
controls.target.set( 0, 115, 0 );
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.minDistance = 80;
controls.maxDistance = 1400;
controls.maxPolarAngle = Math.PI * 0.495;
controls.update();

// One directional light: sun by day/dusk, moon at night.
const sunDir = new THREE.Vector3( 300, 420, 180 ).normalize();
const lightTarget = new THREE.Object3D();
lightTarget.position.set( 0, 100, 0 );
scene.add( lightTarget );

const sun = new THREE.DirectionalLight( 0xffffff, 1 );
sun.castShadow = true;
sun.shadow.mapSize.set( 2048, 2048 );
sun.shadow.camera.left = - 280;
sun.shadow.camera.right = 280;
sun.shadow.camera.top = 280;
sun.shadow.camera.bottom = - 280;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 1500;
sun.shadow.bias = - 0.0004;
sun.shadow.normalBias = 0.6;
sun.shadow.radius = 3;
sun.target = lightTarget;
scene.add( sun );

// ---------------------------------------------------------------------------
// The two lookup textures that make the look
// ---------------------------------------------------------------------------

// 256x1 band LUT: four hard plateaus at the centers of the four palette texels.
function makeBandTexture() {
	const size = 256;
	const data = new Uint8Array( size * 4 );
	const plateaus = [ 0.125, 0.375, 0.625, 0.875 ];
	for ( let i = 0; i < size; i ++ ) {
		const t = ( i + 0.5 ) / size;
		let v;
		if ( t < 0.5 ) v = plateaus[ 0 ];
		else if ( t < 0.625 ) v = plateaus[ 1 ];
		else if ( t < 0.85 ) v = plateaus[ 2 ];
		else v = plateaus[ 3 ];
		const c = Math.round( v * 255 );
		data[ i * 4 + 0 ] = c;
		data[ i * 4 + 1 ] = c;
		data[ i * 4 + 2 ] = c;
		data[ i * 4 + 3 ] = 255;
	}
	const tex = new THREE.DataTexture( data, size, 1, THREE.RGBAFormat, THREE.UnsignedByteType );
	tex.magFilter = THREE.NearestFilter;
	tex.minFilter = THREE.NearestFilter;
	tex.generateMipmaps = false;
	tex.needsUpdate = true;
	return tex;
}

// 4x1 palette LUT, one per material: [shadow, mid, upper, lit].
function makePaletteTexture( hexes ) {
	const data = new Uint8Array( 4 * 4 );
	for ( let i = 0; i < 4; i ++ ) {
		const hex = hexes[ i ];
		data[ i * 4 + 0 ] = ( hex >> 16 ) & 255;
		data[ i * 4 + 1 ] = ( hex >> 8 ) & 255;
		data[ i * 4 + 2 ] = hex & 255;
		data[ i * 4 + 3 ] = 255;
	}
	const tex = new THREE.DataTexture( data, 4, 1, THREE.RGBAFormat, THREE.UnsignedByteType );
	tex.magFilter = THREE.NearestFilter;
	tex.minFilter = THREE.NearestFilter;
	tex.generateMipmaps = false;
	tex.needsUpdate = true;
	return tex;
}

const bandTexture = makeBandTexture();

// ---------------------------------------------------------------------------
// Shaders
// ---------------------------------------------------------------------------
const SHADOW_SAMPLE_GLSL = `
	float shadow = 1.0;
	#ifdef USE_SHADOWMAP
		#if NUM_DIR_LIGHT_SHADOWS > 0
			DirectionalLightShadow dl = directionalLightShadows[ 0 ];
			shadow = getShadow( directionalShadowMap[ 0 ], dl.shadowMapSize, dl.shadowIntensity,
			                    dl.shadowBias, dl.shadowRadius, vDirectionalShadowCoord[ 0 ] );
		#endif
	#endif
	float shadowAmount = ( 1.0 - smoothstep( 0.4, 0.6, shadow ) ) * uReceiveShadow;
	float shadowFactor = mix( 1.0, uShadowStrength, shadowAmount );
`;

const TOON_VERTEX = `
#include <common>
#include <packing>
#include <fog_pars_vertex>
#include <shadowmap_pars_vertex>

uniform vec3 uLightDir;
varying float vDiffuse;

void main() {

	#include <begin_vertex>
	#include <beginnormal_vertex>
	#include <defaultnormal_vertex>
	#include <worldpos_vertex>
	#include <shadowmap_vertex>

	vec3 n = normalize( mat3( modelMatrix ) * normal );   // world space
	vDiffuse = dot( n, uLightDir );                       // one directional light, no ambient

	vec4 mvPosition = modelViewMatrix * vec4( transformed, 1.0 );
	gl_Position = projectionMatrix * mvPosition;

	#include <fog_vertex>

}
`;

const TOON_FRAGMENT = `
#include <common>
#include <packing>
#include <fog_pars_fragment>
#include <shadowmap_pars_fragment>

uniform sampler2D uBands;
uniform sampler2D uPalette;
uniform float uShadowStrength;
uniform float uReceiveShadow;
varying float vDiffuse;

void main() {

	float t = clamp( vDiffuse * 0.5 + 0.5, 0.0, 1.0 );
	float band = texture2D( uBands, vec2( t, 0.5 ) ).r;
	vec3 col = texture2D( uPalette, vec2( band, 0.5 ) ).rgb;

	${ SHADOW_SAMPLE_GLSL }

	// Shadow darkens AFTER the palette lookup, never before the band LUT.
	gl_FragColor = vec4( col * shadowFactor, 1.0 );

	#include <fog_fragment>

}
`;

const OUTLINE_VERTEX = `
#include <common>
#include <packing>
#include <fog_pars_vertex>
#include <shadowmap_pars_vertex>

uniform float uPx;
uniform float uFov;
uniform float uViewportH;

void main() {

	#include <begin_vertex>
	#include <beginnormal_vertex>
	#include <defaultnormal_vertex>
	#include <worldpos_vertex>
	#include <shadowmap_vertex>

	// Inverted hull with a constant width in pixels.
	vec4 mvPosition = modelViewMatrix * vec4( position, 1.0 );
	float worldW = uPx * 2.0 * - mvPosition.z * tan( uFov * 0.5 ) / uViewportH;
	mvPosition.xyz += normalize( normalMatrix * normal ) * worldW;
	gl_Position = projectionMatrix * mvPosition;

	#include <fog_vertex>

}
`;

const OUTLINE_FRAGMENT = `
#include <common>
#include <packing>
#include <fog_pars_fragment>
#include <shadowmap_pars_fragment>

uniform vec3 uColor;
uniform float uShadowStrength;
uniform float uReceiveShadow;

void main() {

	${ SHADOW_SAMPLE_GLSL }

	gl_FragColor = vec4( uColor * shadowFactor, 1.0 );

	#include <fog_fragment>

}
`;

function baseUniforms( extra ) {
	return THREE.UniformsUtils.merge( [
		THREE.UniformsLib.lights,
		THREE.UniformsLib.fog,
		extra
	] );
}

// ---------------------------------------------------------------------------
// Materials: palette name -> [shadow, mid, upper, lit] per time of day
// ---------------------------------------------------------------------------
const PALETTES = {
	iron: {
		day:   [ 0x7d4f2c, 0xa56a38, 0xc8864a, 0xe8a45e ],
		dusk:  [ 0x6a3a1e, 0x9c5828, 0xc87838, 0xf09848 ],
		night: [ 0x26364e, 0x384a66, 0x4a5c7a, 0x68789a ]
	},
	ironDark: {
		day:   [ 0x6d4426, 0x946034, 0xb87a42, 0xd89450 ],
		dusk:  [ 0x5a3016, 0x8a4c24, 0xb86834, 0xd88840 ],
		night: [ 0x1e2c42, 0x2e3e58, 0x3e4e68, 0x586880 ]
	},
	ground: {
		day:   [ 0x3f8a35, 0x5cb04a, 0x6fc258, 0x82d468 ],
		dusk:  [ 0x4a6a28, 0x6a8838, 0x88a848, 0xa8c058 ],
		night: [ 0x16301f, 0x24462e, 0x345c3e, 0x4a7852 ]
	},
	plaza: {
		day:   [ 0xb09058, 0xd0b078, 0xe0c088, 0xf0d098 ],
		dusk:  [ 0xa88850, 0xc8a868, 0xe0c080, 0xf8d898 ],
		night: [ 0x3a3e52, 0x4c5066, 0x5e6278, 0x787c92 ]
	},
	leaf: {
		day:   [ 0x3a7a34, 0x4f9c44, 0x60b452, 0x74cc62 ],
		dusk:  [ 0x3a6a28, 0x558838, 0x70a848, 0x90c058 ],
		night: [ 0x16382a, 0x245038, 0x346848, 0x4a8858 ]
	},
	trunk: {
		day:   [ 0x5a3e26, 0x7a5230, 0x8f6238, 0xa47440 ],
		dusk:  [ 0x5a3820, 0x7a5230, 0x986838, 0xb88048 ],
		night: [ 0x222838, 0x323848, 0x424858, 0x585e70 ]
	},
	cloud: {
		day:   [ 0xc8d8e8, 0xe8f0f8, 0xf4f8fc, 0xffffff ],
		dusk:  [ 0xd89878, 0xf0b890, 0xf8d0b0, 0xffe8d0 ],
		night: [ 0x303c54, 0x404c66, 0x505c78, 0x687490 ]
	}
};

const TIMES = {
	day: {
		sky: 0x56bce8,
		sunDir: new THREE.Vector3( 300, 420, 180 ),
		shadowStrength: 0.5,
		ink: 0x2b1a10
	},
	dusk: {
		sky: 0xef9a58,
		sunDir: new THREE.Vector3( 1.0, 0.16, 0.28 ),
		shadowStrength: 0.42,
		ink: 0x2a1608
	},
	night: {
		sky: 0x16263e,
		sunDir: new THREE.Vector3( 0.5, 0.72, 0.45 ),
		shadowStrength: 0.55,
		ink: 0x0a0e18
	}
};

// Pre-build every palette texture: 7 materials x 3 modes.
const paletteTextures = {};
for ( const name in PALETTES ) {
	paletteTextures[ name ] = {};
	for ( const mode in PALETTES[ name ] ) {
		paletteTextures[ name ][ mode ] = makePaletteTexture( PALETTES[ name ][ mode ] );
	}
}

const toonMaterials = {};
function makeToonMaterial( paletteName, receiveShadow ) {
	const mat = new THREE.ShaderMaterial( {
		name: 'toon-' + paletteName,
		lights: true,
		fog: true,
		uniforms: baseUniforms( {
			uBands: { value: bandTexture },
			uPalette: { value: paletteTextures[ paletteName ].day },
			uLightDir: { value: new THREE.Vector3( 0, 1, 0 ) },
			uShadowStrength: { value: 0.5 },
			uReceiveShadow: { value: receiveShadow ? 1.0 : 0.0 }
		} ),
		vertexShader: TOON_VERTEX,
		fragmentShader: TOON_FRAGMENT
	} );
	mat.userData.palette = paletteName;
	toonMaterials[ paletteName ] = mat;
	return mat;
}

const matIron = makeToonMaterial( 'iron', true );
const matIronDark = makeToonMaterial( 'ironDark', true );
const matGround = makeToonMaterial( 'ground', true );
const matPlaza = makeToonMaterial( 'plaza', true );
const matLeaf = makeToonMaterial( 'leaf', true );
const matTrunk = makeToonMaterial( 'trunk', true );
const matCloud = makeToonMaterial( 'cloud', false ); // clouds opt out of shadows

const outlineMat = new THREE.ShaderMaterial( {
	name: 'outline',
	side: THREE.BackSide,
	lights: true,
	fog: true,
	uniforms: baseUniforms( {
		uColor: { value: new THREE.Color( 0x2b1a10 ) },
		uShadowStrength: { value: 0.5 },
		uReceiveShadow: { value: 1.0 },
		uPx: { value: 1.0 },
		uFov: { value: THREE.MathUtils.degToRad( camera.fov ) },
		uViewportH: { value: window.innerHeight }
	} ),
	vertexShader: OUTLINE_VERTEX,
	fragmentShader: OUTLINE_FRAGMENT
} );

// ---------------------------------------------------------------------------
// Mesh helpers
// ---------------------------------------------------------------------------
const UP = new THREE.Vector3( 0, 1, 0 );
const _dir = new THREE.Vector3();
const _q = new THREE.Quaternion();

// Every real mesh gets an inverted-hull child sharing its geometry.
function finish( mesh, outline ) {
	mesh.castShadow = true;
	mesh.receiveShadow = true;
	if ( outline !== false ) {
		const hull = new THREE.Mesh( mesh.geometry, outlineMat );
		hull.castShadow = false;
		hull.receiveShadow = true;
		mesh.add( hull );
	}
	return mesh;
}

// A tapered cylinder stretched between two world points.
function strut( a, b, radius, radialSegs, material, taperLo = 1.12, taperHi = 0.98 ) {
	_dir.subVectors( b, a );
	const len = _dir.length();
	if ( len < 1e-4 ) return null;
	const geo = new THREE.CylinderGeometry( radius * taperHi, radius * taperLo, len, radialSegs, 1, true );
	const mesh = new THREE.Mesh( geo, material );
	mesh.position.copy( a ).addScaledVector( _dir, 0.5 );
	_q.setFromUnitVectors( UP, _dir.normalize() );
	mesh.quaternion.copy( _q );
	return finish( mesh );
}

// ---------------------------------------------------------------------------
// The tower
// ---------------------------------------------------------------------------
const tower = new THREE.Group();
scene.add( tower );

const PROFILE = [
	{ y: 0.0, w: 62.45 },
	{ y: 57.63, w: 35.35 },
	{ y: 115.73, w: 20.48 },
	{ y: 276.13, w: 9.33 },
	{ y: 300.0, w: 2.0 }
];
const POWERS = [ 1.7, 1.4, 1.15, 1.2 ];

function halfWidth( y ) {
	if ( y <= 0 ) return PROFILE[ 0 ].w;
	if ( y >= 300 ) return PROFILE[ PROFILE.length - 1 ].w;
	let seg = 0;
	for ( let i = 0; i < PROFILE.length - 1; i ++ ) {
		if ( y >= PROFILE[ i ].y && y <= PROFILE[ i + 1 ].y ) { seg = i; break; }
	}
	const a = PROFILE[ seg ], b = PROFILE[ seg + 1 ];
	const u = ( y - a.y ) / ( b.y - a.y );
	// Power-curve blend: steep near the lower anchor, easing into the upper one.
	return b.w + ( a.w - b.w ) * Math.pow( 1.0 - u, POWERS[ seg ] );
}

// Four curved corner legs.
const LEG_STEPS = 32;
const CORNERS = [ [ 1, 1 ], [ - 1, 1 ], [ - 1, - 1 ], [ 1, - 1 ] ];
for ( let c = 0; c < 4; c ++ ) {
	const sx = CORNERS[ c ][ 0 ], sz = CORNERS[ c ][ 1 ];
	const pts = [];
	for ( let i = 0; i < LEG_STEPS; i ++ ) {
		const y = 300 * ( i / ( LEG_STEPS - 1 ) );
		const w = halfWidth( y );
		pts.push( new THREE.Vector3( sx * w, y, sz * w ) );
	}
	for ( let i = 0; i < pts.length - 1; i ++ ) {
		const yMid = 0.5 * ( pts[ i ].y + pts[ i + 1 ].y );
		const r = Math.max( 0.5, halfWidth( yMid ) * 0.08 );
		const seg = strut( pts[ i ], pts[ i + 1 ], r, 8, matIron );
		if ( seg ) tower.add( seg );
	}
}

// Lattice: X bracing plus a top chord per level, per face.
const SECTIONS = [
	{ y0: 0.0, y1: 57.63, levels: 6 },
	{ y0: 57.63, y1: 115.73, levels: 5 },
	{ y0: 115.73, y1: 276.13, levels: 8 },
	{ y0: 276.13, y1: 300.0, levels: 3 }
];

// Point on one of the four faces: s in [-1,1] across the face.
function facePoint( face, s, y ) {
	const w = halfWidth( y );
	switch ( face ) {
		case 0: return new THREE.Vector3( w, y, s * w );
		case 1: return new THREE.Vector3( - w, y, s * w );
		case 2: return new THREE.Vector3( s * w, y, w );
		default: return new THREE.Vector3( s * w, y, - w );
	}
}

for ( let s = 0; s < SECTIONS.length; s ++ ) {
	const sec = SECTIONS[ s ];
	const band = ( sec.y1 - sec.y0 ) / sec.levels;
	for ( let l = 0; l < sec.levels; l ++ ) {
		const yA = sec.y0 + l * band;
		const yB = yA + band;
		const midHalf = halfWidth( 0.5 * ( yA + yB ) );
		const r = Math.max( 0.3, midHalf * 0.028 );
		for ( let f = 0; f < 4; f ++ ) {
			const bl = facePoint( f, - 1, yA );
			const br = facePoint( f, 1, yA );
			const tl = facePoint( f, - 1, yB );
			const tr = facePoint( f, 1, yB );
			const d1 = strut( bl, tr, r, 6, matIron );
			if ( d1 ) tower.add( d1 );
			const d2 = strut( br, tl, r, 6, matIron );
			if ( d2 ) tower.add( d2 );
			const h = strut( tl, tr, r * 1.5, 6, matIron );
			if ( h ) tower.add( h );
		}
	}
}

// Three viewing platforms.
const PLATFORMS = [
	{ y: 57.63, overhang: 1.5, thickness: 6 },
	{ y: 115.73, overhang: 1.5, thickness: 5 },
	{ y: 276.13, overhang: 1.2, thickness: 4 }
];
for ( const p of PLATFORMS ) {
	const half = halfWidth( p.y ) + p.overhang;
	const geo = new THREE.BoxGeometry( half * 2, p.thickness, half * 2 );
	const mesh = new THREE.Mesh( geo, matIronDark );
	mesh.position.set( 0, p.y, 0 );
	tower.add( finish( mesh ) );
}

// Antenna.
{
	const geo = new THREE.CylinderGeometry( 0.35, 1.1, 30, 6, 1, false );
	const mast = new THREE.Mesh( geo, matIronDark );
	mast.position.set( 0, 315, 0 );
	tower.add( finish( mast ) );

	const sGeo = new THREE.SphereGeometry( 1.1, 10, 8 );
	const tip = new THREE.Mesh( sGeo, matIronDark );
	tip.position.set( 0, 330, 0 );
	tower.add( finish( tip ) );
}

// ---------------------------------------------------------------------------
// Ground and plaza. Their inverted hulls sit exactly in the plane they outline,
// so they only ever win the depth test at the discs' silhouettes (a rim line):
// the hull is pushed along the plane's screen-space normal, which for a camera
// above the ground always points toward the far, occluded side of the plane.
// ---------------------------------------------------------------------------
function flatDisc( radius, segments, material, y ) {
	const geo = new THREE.CircleGeometry( radius, segments );
	const disc = new THREE.Mesh( geo, material );
	disc.rotation.x = - Math.PI / 2;
	disc.position.y = y;
	disc.castShadow = false;   // a flat disc at ground level blocks nothing
	disc.receiveShadow = true;
	const hull = new THREE.Mesh( geo, outlineMat );
	hull.castShadow = false;
	hull.receiveShadow = true;
	disc.add( hull );
	scene.add( disc );
	return disc;
}

flatDisc( 1600, 48, matGround, 0 );
flatDisc( 100, 48, matPlaza, 0.15 );

// ---------------------------------------------------------------------------
// Trees
// ---------------------------------------------------------------------------
const TREE_COUNT = 14;
for ( let i = 0; i < TREE_COUNT; i ++ ) {
	const angle = ( i / TREE_COUNT ) * Math.PI * 2 + randRange( - 0.11, 0.11 );
	const radius = randRange( 118, 173 );
	const s = randRange( 0.8, 1.5 );

	const tree = new THREE.Group();
	tree.position.set( Math.cos( angle ) * radius, 0, Math.sin( angle ) * radius );
	tree.rotation.y = randRange( 0, Math.PI * 2 );
	tree.scale.setScalar( s );

	const trunk = new THREE.Mesh( new THREE.CylinderGeometry( 0.55, 0.8, 7, 6, 1, false ), matTrunk );
	trunk.position.y = 3.5;
	tree.add( finish( trunk ) );

	const coneA = new THREE.Mesh( new THREE.ConeGeometry( 6, 10, 7 ), matLeaf );
	coneA.position.y = 11;
	tree.add( finish( coneA ) );

	const coneB = new THREE.Mesh( new THREE.ConeGeometry( 4.6, 8, 7 ), matLeaf );
	coneB.position.y = 16;
	tree.add( finish( coneB ) );

	scene.add( tree );
}

// ---------------------------------------------------------------------------
// Clouds
// ---------------------------------------------------------------------------
const CLOUD_PUFFS = [
	[ 0, 0, 0, 1.0 ],
	[ 9, - 1, 2, 0.75 ],
	[ - 9, - 1.5, - 1, 0.7 ],
	[ 4, 3, - 2, 0.6 ],
	[ - 4, 2.5, 1, 0.55 ]
];
const CLOUD_BASE_R = 7;
const clouds = [];
for ( let i = 0; i < 8; i ++ ) {
	const group = new THREE.Group();
	for ( const p of CLOUD_PUFFS ) {
		const geo = new THREE.SphereGeometry( CLOUD_BASE_R * p[ 3 ], 10, 8 );
		const puff = new THREE.Mesh( geo, matCloud );
		puff.position.set( p[ 0 ], p[ 1 ], p[ 2 ] );
		puff.castShadow = false;
		puff.receiveShadow = false;
		const hull = new THREE.Mesh( geo, outlineMat ); // ink, but no shadow either way
		hull.position.copy( puff.position );
		hull.castShadow = false;
		hull.receiveShadow = false;
		group.add( puff, hull );
	}
	group.scale.set( 1.6, 0.7, 1 );

	const radius = randRange( 420, 920 );
	const angle = randRange( 0, Math.PI * 2 );
	group.position.set( Math.cos( angle ) * radius, randRange( 190, 330 ), Math.sin( angle ) * radius );
	group.userData.speed = randRange( 5, 11 );
	group.userData.drift = 0;
	clouds.push( group );
	scene.add( group );
}

// ---------------------------------------------------------------------------
// Day / Dusk / Night
// ---------------------------------------------------------------------------
const _sunPos = new THREE.Vector3();
let currentMode = 'day';

function syncFogUniforms( material, fog ) {
	material.uniforms.fogColor.value.copy( fog.color );
	material.uniforms.fogNear.value = fog.near;
	material.uniforms.fogFar.value = fog.far;
}

function applyTimeOfDay( name ) {
	const mode = TIMES[ name ] || TIMES.day;
	currentMode = TIMES[ name ] ? name : 'day';

	const sky = new THREE.Color( mode.sky );
	scene.background.copy( sky );
	scene.fog.color.copy( sky );

	sunDir.copy( mode.sunDir ).normalize();
	_sunPos.copy( sunDir ).multiplyScalar( 600 ).add( new THREE.Vector3( 0, 100, 0 ) );
	sun.position.copy( _sunPos );
	lightTarget.position.set( 0, 100, 0 );
	lightTarget.updateMatrixWorld();
	sun.updateMatrixWorld();

	for ( const key in toonMaterials ) {
		const mat = toonMaterials[ key ];
		mat.uniforms.uPalette.value = paletteTextures[ key ][ currentMode ];
		mat.uniforms.uLightDir.value.copy( sunDir );
		mat.uniforms.uShadowStrength.value = mode.shadowStrength;
		syncFogUniforms( mat, scene.fog );
	}

	outlineMat.uniforms.uColor.value.set( mode.ink );
	outlineMat.uniforms.uShadowStrength.value = mode.shadowStrength;
	syncFogUniforms( outlineMat, scene.fog );

	for ( const btn of document.querySelectorAll( '#ui button' ) ) {
		btn.classList.toggle( 'active', btn.dataset.tod === currentMode );
	}
}

document.getElementById( 'ui' ).addEventListener( 'click', ( e ) => {
	const btn = e.target.closest( 'button' );
	if ( btn && btn.dataset.tod ) applyTimeOfDay( btn.dataset.tod );
} );

const params = new URLSearchParams( location.search );
const requested = params.get( 'tod' );
applyTimeOfDay( requested && TIMES[ requested ] ? requested : 'day' );

// ---------------------------------------------------------------------------
// Resize + animation
// ---------------------------------------------------------------------------
function onResize() {
	const w = window.innerWidth, h = window.innerHeight;
	camera.aspect = w / h;
	camera.updateProjectionMatrix();
	renderer.setSize( w, h );
	outlineMat.uniforms.uFov.value = THREE.MathUtils.degToRad( camera.fov );
	outlineMat.uniforms.uViewportH.value = h;
}
window.addEventListener( 'resize', onResize );
onResize();

let lastTime = performance.now();

function animate() {
	const now = performance.now();
	const dt = Math.min( ( now - lastTime ) / 1000, 0.1 );
	lastTime = now;

	for ( const cloud of clouds ) {
		cloud.position.x += cloud.userData.speed * dt;
		if ( cloud.position.x > 1200 ) cloud.position.x = - 1200;
	}

	controls.update();
	renderer.render( scene, camera );
}
renderer.setAnimationLoop( animate );
</script>
