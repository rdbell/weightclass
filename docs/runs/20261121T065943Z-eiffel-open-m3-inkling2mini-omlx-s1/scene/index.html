<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eiffel Tower — Toon Adventure</title>
<style>
  :root {
    --ink: #2b2540;
    --cream: #fff6e3;
    --accent: #ffce54;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Avenir Next Rounded', 'Trebuchet MS', 'Comic Sans MS', 'Segoe UI', system-ui, sans-serif;
    background: #10142a;
  }
  #scene {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    display: block;
    touch-action: none;
    cursor: grab;
  }
  #scene:active { cursor: grabbing; }
  .vignette {
    position: fixed; inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 55%, rgba(18,10,28,0.38) 100%);
  }
  .title-card {
    position: fixed; top: 18px; left: 18px;
    pointer-events: none;
    background: var(--cream);
    border: 3px solid var(--ink);
    border-radius: 18px;
    box-shadow: 5px 5px 0 rgba(24, 18, 34, 0.45);
    padding: 12px 18px 13px;
    max-width: 300px;
  }
  .title-card h1 {
    margin: 0;
    font-size: clamp(20px, 2.6vw, 30px);
    line-height: 1.02;
    letter-spacing: 0.3px;
    color: var(--ink);
    text-transform: uppercase;
  }
  .title-card p {
    margin: 6px 0 0;
    font-size: clamp(10px, 1.1vw, 13px);
    font-weight: 700;
    color: #7a6a4e;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .hint {
    position: fixed; top: 18px; right: 18px;
    pointer-events: none;
    background: rgba(20, 18, 38, 0.78);
    color: #f4ecdd;
    border: 2.5px solid rgba(255, 246, 227, 0.22);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.4px;
  }
  .mode-dock {
    position: fixed; left: 50%; bottom: 20px;
    transform: translateX(-50%);
    display: flex; gap: 10px;
    align-items: center;
    z-index: 10;
  }
  .mode-btn {
    font-family: inherit;
    font-weight: 800;
    font-size: clamp(14px, 1.5vw, 19px);
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--cream);
    border: 3.5px solid var(--ink);
    border-radius: 999px;
    padding: 11px 26px;
    cursor: pointer;
    box-shadow: 4px 4px 0 rgba(24, 18, 34, 0.45);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.25s ease, color 0.25s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .mode-btn:hover { transform: translateY(-3px); box-shadow: 5px 7px 0 rgba(24, 18, 34, 0.45); }
  .mode-btn:active { transform: translateY(1px); box-shadow: 2px 2px 0 rgba(24, 18, 34, 0.45); }
  .mode-btn.active {
    background: var(--accent);
    transform: translateY(-2px);
    box-shadow: 4px 6px 0 rgba(24, 18, 34, 0.45);
  }
  .mode-btn[data-mode="dusk"].active { background: #ff9e5e; }
  .mode-btn[data-mode="night"].active { background: #3d4f8a; color: #f4ecdd; }
  .mode-btn:focus-visible { outline: 3px solid #ffffff; outline-offset: 2px; }
  @media (max-width: 640px) {
    .hint { display: none; }
    .title-card { max-width: 220px; padding: 10px 14px; }
    .mode-btn { padding: 9px 18px; }
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "../../../vendor/three/build/three.module.js",
    "three/addons/": "../../../vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette"></div>
<header class="title-card">
  <h1>Eiffel Tower</h1>
  <p>A toon adventure in Paris</p>
</header>
<div class="hint">drag to orbit &nbsp;·&nbsp; scroll to zoom &nbsp;·&nbsp; 1 / 2 / 3 for day · dusk · night</div>
<nav class="mode-dock" aria-label="Time of day">
  <button class="mode-btn" data-mode="day">Day</button>
  <button class="mode-btn" data-mode="dusk">Dusk</button>
  <button class="mode-btn" data-mode="night">Night</button>
</nav>
<script type="module" src="./src/main.js"></script>
</body>
</html>
